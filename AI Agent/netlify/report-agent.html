}

// ===== Fitur "Explain Why?" & "Details" (fitur baru) =====
// Tujuannya: user bisa AUDIT reasoning AI tanpa nge-prompt ulang. Caranya —
// begitu balasan agent kelar, kita gak nanya AI lagi, tapi nyisir ULANG teks
// balasan itu buat nyari entity (vendor/driver/trip) yang paling relevan
// disebut di situ, lalu hitung breakdown status-nya LANGSUNG dari currentTrips
// (data yang emang jadi sumber balasan AI tadi) — sama kayak filosofi
// computeConvoyGroups()/buildDailyBriefingText(): angka dihitung sekali di JS
// biar konsisten, bukan diserahin ke AI buat diitung ulang & bisa ngarang.
function buildExplainData(replyText){
  const trips = (typeof currentTrips !== "undefined" && currentTrips) || [];
  if (!trips.length) return null;
  const lower = (replyText || "").toLowerCase();

  // Prioritas deteksi entity yang disebut di balasan: Vendor > Driver > No Trip.
  // Vendor didahuluin karena paling sering jadi subjek pertanyaan performa
  // ("Vendor mana yang paling sering telat?").
  let entityLabel = null, entityValue = null, matchTrips = null;

  const vendorNames = [...new Set(trips.map(t => t.vendorName).filter(v => v && v !== "-"))];
  const matchedVendor = vendorNames.find(v => lower.includes(v.toLowerCase()));
  if (matchedVendor){
    entityLabel = "Vendor"; entityValue = matchedVendor;
    matchTrips = trips.filter(t => t.vendorName === matchedVendor);
  }
  if (!matchTrips){
    const driverNames = [...new Set(trips.map(t => t.driver).filter(v => v && v !== "-"))];
    const matchedDriver = driverNames.find(v => lower.includes(v.toLowerCase()));
    if (matchedDriver){
      entityLabel = "Driver"; entityValue = matchedDriver;
      matchTrips = trips.filter(t => t.driver === matchedDriver);
    }
  }
  if (!matchTrips){
    const matchedTrip = trips.find(t => t.tripNum && t.tripNum !== "-" && lower.includes(t.tripNum.toLowerCase()));
    if (matchedTrip){
      entityLabel = "Trip"; entityValue = matchedTrip.tripNum;
      matchTrips = trips.filter(t => t.tripNum === matchedTrip.tripNum);
    }
  }

  // Scope waktu: dibaca dari kata kunci yang kesebut di balasan sendiri, biar
  // breakdown-nya konsisten sama periode yang lagi dibahas AI ("bulan ini",
  // "hari ini", "minggu ini"/"7 hari"). Default: semua data yang lagi kemuat.
  let scopeLabel = "yang tercatat";
  let scopeTrips = matchTrips || trips;
  const now = new Date();
  const todayStr = formatDateYYYYMMDDLocal(now);
  if (/bulan ini/.test(lower)){
    const ym = todayStr.slice(0,7);
    scopeTrips = scopeTrips.filter(t => t.tanggal && t.tanggal.slice(0,7) === ym);
    scopeLabel = "bulan ini";
  } else if (/hari ini/.test(lower)){
    scopeTrips = scopeTrips.filter(t => t.tanggal === todayStr);
    scopeLabel = "hari ini";
  } else if (/minggu ini|7 hari/.test(lower)){
    const weekAgo = new Date(todayStr + "T00:00:00");
    weekAgo.setDate(weekAgo.getDate() - 7);
    scopeTrips = scopeTrips.filter(t => t.tanggal && new Date(t.tanggal + "T00:00:00") >= weekAgo);
    scopeLabel = "7 hari terakhir";
  }

  if (!scopeTrips.length) return null;

  const counts = { "Late Arrival":0, "On Time":0, "Early Arrived":0, "In Transit":0 };
  scopeTrips.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
  const finished = counts["Late Arrival"] + counts["On Time"] + counts["Early Arrived"];
  const lateRate = finished ? ((counts["Late Arrival"] / finished) * 100).toFixed(1) : "0.0";

  return {
    entityLabel: entityLabel || "Semua trip",
    entityValue: entityValue || "",
    scopeLabel, scopeTrips,
    total: scopeTrips.length,
    counts, lateRate
  };
}

// Render markdown (bold/italic/list/link/code fence) jadi HTML, lalu jalanin
// syntax highlighting di tiap blok <pre><code>. Dipanggil buat bubble agent
// SETELAH typewriter kelar ngetik (biar gak parsing HTML di tengah animasi).
// Line tunggal (bukan baris kosong) dari "replyLines" harus tetep dianggap
// ganti baris pas di-render markdown — default marked.js NGE-GABUNG newline
// tunggal jadi satu paragraf (butuh baris kosong buat paragraf baru), yang
// bikin baris-baris kayak "(0)Antri" / "(1)In Progress" numpuk jadi satu
// baris panjang. "breaks:true" nyamain perilakunya sama kayak sebelumnya
// (white-space:pre-wrap versi plain text) tapi tetep dapet markdown+highlight.
if (window.marked && marked.setOptions){
  marked.setOptions({ breaks: true, gfm: true });
}

function renderMarkdownInto(bubbleEl, rawText){
  try{
    bubbleEl.innerHTML = marked.parse(rawText || "");
    bubbleEl.querySelectorAll("pre code").forEach(block => {
      try{ hljs.highlightElement(block); }catch(e){ /* abaikan kalau hljs gagal */ }
    });
  }catch(e){
    bubbleEl.textContent = rawText; // fallback plain text kalau marked/hljs gagal load
  }
}

// Efek ngetik karakter-per-karakter buat balasan agent. Ngetik teks MENTAH
// (textContent, bukan innerHTML) dulu biar gak ada tag html "kepotong" di
// tengah jalan, baru begitu kelar di-render ulang jadi markdown+highlight.
function typewriterInto(bubbleEl, fullText, onDone){
  const cursor = document.createElement("span");
  cursor.className = "typewriter-cursor";
  bubbleEl.textContent = "";
  bubbleEl.appendChild(cursor);
  const speed = fullText.length > 400 ? 4 : (fullText.length > 150 ? 10 : 18); // makin panjang, makin cepet
  let i = 0;
  (function step(){
    i += Math.max(1, Math.round(fullText.length / 220)); // biar teks panjang gak kelamaan ngetik
    bubbleEl.textContent = fullText.slice(0, i);
    bubbleEl.appendChild(cursor);
    document.getElementById("chatLog").scrollTop = document.getElementById("chatLog").scrollHeight;
    if (i < fullText.length){
      setTimeout(step, speed);
    } else {
      cursor.remove();
      if (onDone) onDone();
    }
  })();
}

// Bikin bunyi "blip" halus pakai oscillator, bukan file audio — biar ringan
// & gak perlu nge-load asset tambahan. "sent" nadanya naik dikit (lebih
// "aktif"), "received" nadanya turun pelan (lebih "lembut"). Volume sengaja
// dijaga kecil (gain rendah) + envelope cepet biar kesannya "halus", gak
// ganggu kayak notifikasi HP.
function ensureAudioCtx(){
  if (!odysseyAudioCtx){
    try{ odysseyAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ odysseyAudioCtx = null; }
  }
  return odysseyAudioCtx;
}
function playChatSound(kind){
  if (!soundEnabled) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  try{
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    if (kind === "sent"){
      osc.frequency.setValueAtTime(720, now);
      osc.frequency.exponentialRampToValueAtTime(940, now + 0.07);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.06, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      osc.start(now); osc.stop(now + 0.13);
    } else {
      osc.frequency.setValueAtTime(560, now);
      osc.frequency.exponentialRampToValueAtTime(430, now + 0.15);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.05, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      osc.start(now); osc.stop(now + 0.23);
    }
  }catch(e){ /* browser kadang nge-block audio sebelum ada interaksi user — abaikan aja */ }
}

  col.style.display = "flex"; col.style.flexDirection = "column"; col.style.gap = "6px";

  who.appendChild(whoText);

    const badge = document.createElement("span");
    badge.className = "model-badge";
    badge.textContent = modelLabel;
    who.appendChild(badge);
  }
  col.appendChild(who);

  if (imageDataUrl){
    const img = document.createElement("img");
    img.className = "msg-image";
    img.src = imageDataUrl;
    img.alt = "gambar terlampir";
    img.addEventListener("click", () => openLightbox(imageDataUrl));
    col.appendChild(img);
  }
  let bubble = null;
  if (text && text.trim()){
    bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user"){
      bubble.textContent = text; // pesan user gak perlu markdown/typewriter
    }
    col.appendChild(bubble);
  }
  if (attachUnits && attachUnits.length){
    const card = document.createElement("div");
    card.innerHTML = renderAttachCard(attachUnits);
    col.appendChild(card);
  }
  row.appendChild(avatar);
  row.appendChild(col);
  wrap.appendChild(row);

  // Balasan agent: ngetik dulu (typewriter) baru di-render jadi markdown +
  // syntax highlight begitu kelar. Kalau instant=true (lagi muat ulang sesi
  // lama dari sidebar riwayat), langsung render penuh tanpa animasi ngetik.
  if (role !== "user" && bubble){
    if (instant){
      renderMarkdownInto(bubble, text);
    } else {
      typewriterInto(bubble, text, () => renderMarkdownInto(bubble, text));
    }
  }

  if (role !== "user" && text && text.trim()){
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-btn";
    copyBtn.type = "button";
    copyBtn.textContent = "📋 Copy";
    copyBtn.addEventListener("click", () => {
      const finish = () => {
        copyBtn.textContent = "✓ Tersalin";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "📋 Copy";
          copyBtn.classList.remove("copied");
        }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(finish).catch(() => {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          finish();
        });
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        finish();
      }
    });
    const actionsRow = document.createElement("div");
    actionsRow.className = "msg-actions";
    actionsRow.appendChild(copyBtn);

    // "Explain": nampilin breakdown angka (Late/On Time/Early + late rate) di
    // BALIK jawaban AI, dihitung langsung dari currentTrips — jadi user bisa
    // audit reasoning-nya tanpa harus nge-prompt ulang.
    const explainBtn = document.createElement("button");
    explainBtn.className = "copy-btn explain-btn";
    explainBtn.type = "button";
    explainBtn.textContent = "💡 Explain";
    let explainPanel = null;
    explainBtn.addEventListener("click", () => {
      if (explainPanel){
        explainPanel.remove();
        explainPanel = null;
        explainBtn.textContent = "💡 Explain";
        return;
      }
      explainBtn.textContent = "💡 Tutup";
      explainPanel = buildExplainPanel(buildExplainData(text));
      col.insertBefore(explainPanel, actionsRow);

// ===== Command Bar / AI Command Palette =====
// Ketik "/" di chat input buat munculin daftar shortcut command (/late, /convoy,
// /report, /vendor, /queue, /stock, /dw, /summary), atau tetep bisa ngetik
// pertanyaan natural language bebas kayak biasa. Setiap command di-map ke kalimat
// pertanyaan yang udah kena kata kunci deteksi topik di askAgent() (lihat
// dwKeywords/queueKeywords/inventoryControlKeywords/dataKeywords di atas), jadi
// hasilnya sama persis kayak user ngetik manual.
const SLASH_COMMANDS = [
  { cmd: "/late",    icon: "🕒", label: "Late Arrival",    desc: "Cek unit yang Late Arrival hari ini",         query: "Ada unit Late Arrival hari ini?" },
  { cmd: "/convoy",  icon: "🚚", label: "Convoy",           desc: "Cek unit yang jalan Convoy/beriringan",       query: "Ada unit Convoy hari ini?" },
  { cmd: "/report",  icon: "📋", label: "Report Trip",      desc: "Rekap lengkap trip Inbound hari ini",         query: "Buatkan report lengkap trip Inbound hari ini" },
  { cmd: "/vendor",  icon: "🏢", label: "Vendor",           desc: "Analisa performa & keterlambatan vendor",     query: "Vendor mana yang paling sering telat?" },
  { cmd: "/queue",   icon: "🚦", label: "Antrian Inbound",  desc: "Report Antrian Inbound (ECO vs STD)",         query: "Buatkan Report Antrian Inbound (ECO vs STD) hari ini" },
  { cmd: "/stock",   icon: "📦", label: "Stock",            desc: "Cek stock inventory yang udah menipis",       query: "Stock barang apa aja yang udah menipis?" },
  { cmd: "/dw",      icon: "👷", label: "DW Fulfillment",   desc: "Report pemenuhan Daily Worker",               query: "Buatkan Report DW Fulfillment hari ini" },
  { cmd: "/summary", icon: "🧾", label: "Summary",          desc: "Rekap semua trip hari ini",                   query: "Rekap semua trip hari ini" },
];
let cmdPaletteMatches = [];
let cmdPaletteIndex = 0;

function renderCmdPalette(matches){
  cmdPaletteMatches = matches;
  cmdPaletteIndex = 0;
  const wrap = document.getElementById("cmdPalette");
  wrap.innerHTML = "";
  const hint = document.createElement("div");
  hint.className = "cmd-palette-hint";
  hint.textContent = "Command — ↑↓ pilih, Enter jalanin";
  wrap.appendChild(hint);
  matches.forEach((c, i) => {
    const item = document.createElement("div");
    item.className = "cmd-palette-item" + (i === 0 ? " active" : "");
    item.innerHTML = `<span class="cmd-icon">${c.icon}</span><div class="cmd-text"><span class="cmd-name">${c.cmd}</span><span class="cmd-desc">${c.label} — ${c.desc}</span></div>`;
    item.addEventListener("mousedown", (e) => {
      e.preventDefault(); // biar input gak keburu blur sebelum kita proses klik
      runSlashCommand(c);
    });
    wrap.appendChild(item);
  });
  wrap.classList.add("show");
}
function hideCmdPalette(){
  const wrap = document.getElementById("cmdPalette");
  wrap.classList.remove("show");
  wrap.innerHTML = "";
  cmdPaletteMatches = [];
  cmdPaletteIndex = 0;
}
function isCmdPaletteOpen(){
  return cmdPaletteMatches.length > 0;
}
function highlightCmdPaletteIndex(){
  const wrap = document.getElementById("cmdPalette");
  Array.from(wrap.querySelectorAll(".cmd-palette-item")).forEach((el, i) => {
    el.classList.toggle("active", i === cmdPaletteIndex);
  });
}
function updateCmdPalette(value){
  if (!value.startsWith("/")){ hideCmdPalette(); return; }
  const token = value.slice(1).toLowerCase();
  const matches = SLASH_COMMANDS.filter(c =>
    c.cmd.slice(1).toLowerCase().startsWith(token) || c.label.toLowerCase().includes(token)
  );
  if (!matches.length){ hideCmdPalette(); return; }
  renderCmdPalette(matches);
}
function runSlashCommand(c){
  hideCmdPalette();
  const input = document.getElementById("chatInput");
  input.value = "";
  commitSend(c.query);
}
// Return true kalau tombolnya udah ditangani sama command palette (biar keydown
// handler utama di chatInput gak ikut2an proses, misal Enter buat kirim biasa).
function handleCmdPaletteKeydown(e){
  if (!isCmdPaletteOpen()) return false;
  if (e.key === "ArrowDown"){
    e.preventDefault();
    cmdPaletteIndex = (cmdPaletteIndex + 1) % cmdPaletteMatches.length;
    highlightCmdPaletteIndex();
    return true;
  }
  if (e.key === "ArrowUp"){
    e.preventDefault();
    cmdPaletteIndex = (cmdPaletteIndex - 1 + cmdPaletteMatches.length) % cmdPaletteMatches.length;
    highlightCmdPaletteIndex();
    return true;
  }
  if (e.key === "Enter" || e.key === "Tab"){
    e.preventDefault();
    runSlashCommand(cmdPaletteMatches[cmdPaletteIndex]);
    return true;
  }
  if (e.key === "Escape"){
    e.preventDefault();
    hideCmdPalette();
    return true;
  }
  return false;
}

// ===== Simpen & muat histori chat per-user ke/dari Firebase =====
// (bukan cuma di memory browser kayak sebelumnya — refresh/ganti device,
// histori tetep ada selama masih login akun yang sama & masih online).
function getCurrentUid(){
  try{
    const u = window.firebase && firebase.auth && firebase.auth().currentUser;
    return u ? u.uid : null;
  }catch(e){ return null; }
}
// Ubah email user yang lagi login jadi nama tampilan buat label chat.
// Contoh: "irwan.faiz@spxexpress.com" -> "Irwan Faiz". Kalau gagal
// (belum login / gak ada email di akun), fallback ke "Lo" kayak sebelumnya.
function getCurrentUserLabel(){
  try{
    const u = window.firebase && firebase.auth && firebase.auth().currentUser;
    if (!u || !u.email) return "Lo";
    const namePart = u.email.split("@")[0];
    const nameFormatted = namePart
      .split(/[.\-_]+/)
      .filter(Boolean)
      .map(function(s){ return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); })
      .join(" ");
    return nameFormatted || "Lo";
  }catch(e){ return "Lo"; }
}
function newSessionId(){
  return "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}
// Jangan simpen base64 gambar mentah ke Firebase (bisa berat banget & bikin
// database bengkak) — pas nyimpen histori, konten gambar diganti placeholder
// teks aja. Gambar tetep kepake normal buat sesi yang lagi jalan (di memory).
function sanitizeMessagesForSave(history){
  return history.map(function(m){
    if (Array.isArray(m.content)){
      const textPart = m.content.find(function(p){ return p && p.type === "text"; });
      return { role: m.role, content: (textPart && textPart.text) || "(kirim gambar)" };
    }
    return { role: m.role, content: String(m.content == null ? "" : m.content) };
  });
}
function scheduleSaveSession(){
  if (!firebaseReady) return; // mode mock/offline: histori cuma kesimpen di memory browser aja
  if (!chatHistory.length) return;
  clearTimeout(saveSessionTimer);
  saveSessionTimer = setTimeout(saveSessionNow, 900); // debounce biar gak nulis tiap detik
}
function saveSessionNow(){
  const uid = getCurrentUid();
  if (!uid || !window.firebase || !firebase.database) return;
  if (!currentSessionId) currentSessionId = newSessionId();
  const firstUserMsg = chatHistory.find(function(m){ return m.role === "user"; });
  let title = "Chat baru";
  if (firstUserMsg){
    const raw = Array.isArray(firstUserMsg.content)
      ? ((firstUserMsg.content.find(function(p){ return p && p.type === "text"; }) || {}).text || "Kirim gambar")
      : String(firstUserMsg.content || "");
    title = raw.trim().slice(0, 60) || "Chat baru";
  }
  const payload = {
    title: title,
    updatedAt: firebase.database.ServerValue.TIMESTAMP,
    messages: sanitizeMessagesForSave(chatHistory)
  };
  firebase.database().ref(ODYSSEY_CHAT_ROOT + "/" + uid + "/" + currentSessionId).set(payload)
    .then(function(){ refreshSessionsList(); })
    .catch(function(e){ console.warn("Gagal simpen histori chat:", e.message); });
}
function refreshSessionsList(){
  const listEl = document.getElementById("sessionsList");
  const uid = getCurrentUid();
  if (!uid || !window.firebase || !firebase.database){
    listEl.innerHTML = '<div class="sessions-empty">Riwayat cuma kesimpen kalau lagi login &amp; online bro.</div>';
    return;
  }
  firebase.database().ref(ODYSSEY_CHAT_ROOT + "/" + uid).once("value")
    .then(function(snap){
      const items = [];
      snap.forEach(function(child){
        const v = child.val() || {};
        items.push({ id: child.key, title: v.title || "Chat", updatedAt: v.updatedAt || 0 });
      });
      items.sort(function(a, b){ return b.updatedAt - a.updatedAt; });
      renderSessionsList(items);
    })
    .catch(function(e){
      listEl.innerHTML = '<div class="sessions-empty">Gagal muat riwayat: ' + e.message + '</div>';
    });
}
function renderSessionsList(items){
  const listEl = document.getElementById("sessionsList");
  listEl.innerHTML = "";
  if (!items.length){
    listEl.innerHTML = '<div class="sessions-empty">Belum ada riwayat chat.</div>';
    return;
  }
  items.forEach(function(it){
    const el = document.createElement("button");
    el.type = "button";
    el.className = "session-item" + (it.id === currentSessionId ? " active" : "");
    const titleEl = document.createElement("span");
    titleEl.className = "session-title";
    titleEl.textContent = it.title;
    const metaEl = document.createElement("span");
    metaEl.className = "session-meta";
    if (it.updatedAt){
      const d = new Date(it.updatedAt);
      const pad = function(n){ return String(n).padStart(2, "0"); };
      metaEl.textContent = pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    }
    el.appendChild(titleEl);
    el.appendChild(metaEl);
    el.addEventListener("click", function(){ loadSession(it.id); });
    listEl.appendChild(el);
  });
}
function loadSession(sessionId){
  const uid = getCurrentUid();
  if (!uid || !window.firebase || !firebase.database) return;
  firebase.database().ref(ODYSSEY_CHAT_ROOT + "/" + uid + "/" + sessionId).once("value")
    .then(function(snap){
      const v = snap.val();
      if (!v) return;
      currentSessionId = sessionId;
      const msgs = Array.isArray(v.messages) ? v.messages : [];
      document.getElementById("chatLog").innerHTML = "";
      chatHistory = [];
      clearPendingImage();
      msgs.forEach(function(m){
        const role = m.role === "user" ? "user" : "assistant";
        chatHistory.push({ role: role, content: m.content });
        addMessage(role === "user" ? "user" : "agent", m.content, null, null, null, true);
      });
      refreshSessionsList();
    })
    .catch(function(e){ console.warn("Gagal muat sesi:", e.message); });
}

// Ubah pesan error teknis dari API jadi kalimat simpel yang enak dibaca user
// biasa, bukan mentahan pesan Gemini/HTTP yang penuh istilah teknis.
function simplifyErrorMessage(raw){
  const msg = String(raw || "");

  // Kena limit pemakaian (rate limit / quota harian free tier Gemini, dll)
  if (/rate.?limit/i.test(msg) || /RESOURCE_EXHAUSTED/i.test(msg) || /quota/i.test(msg)){
    // Kalau Gemini kasih tau berapa detik lagi harus nunggu (retryDelay/"try again
    // in 12.3s"), hitung jadi jam WIB yang konkret. Kalau gak ada info itu, kasih
    // estimasi umum.
    const waitMatch = msg.match(/try again in\s*([\d.]+)\s*s/i) || msg.match(/"retryDelay"\s*:\s*"([\d.]+)s"/i);
    if (waitMatch){
      const waitSeconds = parseFloat(waitMatch[1]);
      const retryAt = new Date(Date.now() + waitSeconds * 1000);
      const hh = String(retryAt.getHours()).padStart(2,"0");
      const mm = String(retryAt.getMinutes()).padStart(2,"0");
      return `Anda telah melebihi limit penggunaan AI Agent. Mohon gunakan kembali pada jam ${hh}:${mm} WIB ya bro.`;
    }
    return "Anda telah melebihi limit penggunaan AI Agent bro. Mohon tunggu sekitar 1 menit lalu coba lagi ya.";
  }

  // Model gak ketemu/gak bisa diakses, atau kena filter safety Gemini
  if (/does not exist|do not have access|not found|NOT_FOUND/i.test(msg)){
    return "Waduh, model AI-nya lagi bermasalah di sisi server bro. Coba lagi sebentar, atau kabarin admin kalau masih error terus.";
  }
  if (/SAFETY|blockReason|PROHIBITED_CONTENT/i.test(msg)){
    return "Waduh, jawabannya keblokir filter safety AI bro. Coba tulis ulang pertanyaannya dengan cara lain ya.";
  }

  // Server function belum ke-deploy / respons bukan JSON
  if (/non-JSON|Server balikin respons/i.test(msg)){
    return "Waduh, server AI Agent-nya lagi gak bisa dihubungin bro. Coba refresh & tanya lagi sebentar ya.";
  }

  // Fallback umum — gak nampilin detail teknis mentah ke user
  return "Waduh, gagal ngambil jawaban AI bro. Coba tanya ulang sebentar lagi ya.";
}

// ===== KLASIFIKASI MODUL PAKAI AI (BARU) — fallback kalau regex kosakata di
// atas gak nangkep apa-apa =====
// Kata kunci di ACCESS_MAP/keywords atas itu daftar ISTILAH TETAP — kalau ada
// karyawan yang nanya pakai singkatan/slang/typo baru yang belum pernah
// dimasukin ke regex manapun, pertanyaannya bisa jatuh ke "obrolan santai"
// padahal maksudnya nanya data. Fungsi ini jadi jaring pengaman kedua: SEKALI
// panggilan ekstra & ringan ke Gemini (proxy yang sama), minta AI nebak modul
// mana yang paling relevan dari pertanyaan mentahnya (bukan dari regex),
// balikin array key modul. Dipanggil CUMA kalau regex bener-bener 0 match
// tapi pertanyaannya kecium "data-ish" (lihat isDataQuery) — jadi gak nambah
// panggilan API buat pertanyaan yang emang udah jelas jawabannya modul mana
// (regex sendiri masih jadi jalur utama, cepat & gratis, ini cuma cadangan).
const VALID_MODULE_KEYS = ["rest_asset", "outbound", "performance_bagger", "inventory_control", "inbound"];
async function classifyModulesWithAI(question){
  try{
    const classifyPrompt = `Kamu classifier internal buat sistem dashboard, BUKAN buat ngobrol sama user. Dari pertanyaan
mentah di bawah, tentuin modul dashboard mana aja (boleh 1, boleh lebih dari 1, boleh juga TIDAK ADA
yang cocok) yang paling relevan — walau pertanyaannya pakai singkatan/istilah lapangan/typo yang gak
baku. Daftar modul & cakupan topiknya:
- rest_asset: Rest Time & Asset Usage Monitoring (istirahat/break operator, pinjam-balikin PDA,
  check-in/out, idle asset, kelamaan istirahat)
- outbound: Outbound Monitoring (aging parcel, packer backlog, occupancy/kepenuhan staging gudang,
  jadwal shift keberangkatan, rute linehaul)
- performance_bagger: Performance Bagger (produktivitas packing harian per operator, achievement rate,
  red flag/needs coaching, ranking/leaderboard operator)
- inventory_control: Inventory Control (stock barang consumable/ATK, Asset IT & NCA non-consumable,
  audit log perubahan data, reorder barang menipis)
- inbound: Trip Inbound (Line Haul truk dari origin ke DC, Late/Early Arrival, convoy/beriringan,
  vendor/driver truk)

Pertanyaan user: "${question}"

WAJIB balas HANYA dengan key modul dipisah koma tanpa spasi, PERSIS salah satu/gabungan dari:
rest_asset, outbound, performance_bagger, inventory_control, inbound — TANPA teks/penjelasan lain.
Kalau beneran gak ada satupun yang cocok (obrolan santai/pertanyaan umum), balas persis satu kata: none`;
    const resp = await fetch("/.netlify/functions/gemini-proxy", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        max_tokens: 30,
        thinking_level: "minimal",
        system: classifyPrompt,
        contents: [{ role: "user", parts: [{ text: question || "" }] }]
      })
    });
    if (!resp.ok) return [];
    const data = await resp.json();
    const candidate = (data.candidates && data.candidates[0]) || null;
    const raw = candidate && candidate.content && Array.isArray(candidate.content.parts)
      ? candidate.content.parts.map(p => (p && p.text) || "").join("").trim().toLowerCase()
      : "";
    if (!raw || raw === "none") return [];
    return raw.split(",").map(k => k.trim()).filter(k => VALID_MODULE_KEYS.includes(k));
  }catch(e){
    console.error("Gagal klasifikasi modul via AI (fallback ke mode Inbound default):", e);
    return [];
  }
}

async function askAgent(question, imageDataUrl){
  addMessage("user", question, null, imageDataUrl);
  // Kalau ada gambar, isi content jadi array format vision (OpenAI-compatible)
  // biar bisa dikirim ke model yang bisa "lihat" gambar lewat proxy.
  const userContent = imageDataUrl
    ? [
        { type:"text", text: question || "Tolong lihat & jelasin gambar ini bro." },
        { type:"image_url", image_url:{ url: imageDataUrl } }
      ]
    : question;
  chatHistory.push({role:"user", content: userContent, hasImage: !!imageDataUrl});
  scheduleSaveSession();
  addTyping();

  const lateCount = currentTrips.filter(t => t.status === "Late Arrival").length;
  const convoyGroups = computeConvoyGroups(currentTrips);

    // KPI/leaderboard pemakaian), Stock (database barang consumable + Min Stock), Asset IT & NCA
    // (database aset non-consumable per unit dengan PIC/lokasi/status), dan Audit Log (riwayat
    // perubahan). Data LIVE dari Firebase root "inventoryControl/SOC" (SAMA PERSIS sumber yang dipakai
    // dashboard inventory-control.html), diringkas + di-dump lewat buildInventoryControlSummary().
    const invSummary = buildInventoryControlSummary(currentInvStock, currentInvUsageLogs, currentInvAssetItNca, currentInvAuditLog);
    moduleBlocks.push(`
Pertanyaan kali ini soal MODUL INVENTORY CONTROL — database Stock barang consumable, Asset IT & NCA
(non-consumable per unit), Log Activity Usage & Highlight Usage (pemakaian harian per Devisi), dan Audit
Log. Bukan trip Inbound, bukan DW Fulfillment, bukan Antrian Inbound, bukan Rest Time/Asset Usage
(beda modul meski sama-sama ada kata "asset" — Rest Time/Asset Usage itu soal PDA yang dipinjam/
dikembalikan operator per shift, BEDA KONSEP dari Asset IT & NCA di modul ini), bukan modul Outbound,
dan bukan Performance Bagger. Kalau di riwayat percakapan sebelumnya ada pembahasan topik LAIN, ABAIKAN
TOTAL itu buat jawaban kali ini — satu-satunya sumber kebenaran buat topik ini adalah dump JSON
"ringkasanInventoryControl" di bawah (SELALU paling baru/fresh tiap kamu jawab).

PENTING konteks tiap bagian JSON-nya:
- "devisiInfo": Devisi SOC = "Sortation Center", EHA = "Exception Handling Area" — dua-duanya SATU
  dashboard/database gabungan (bukan 2 modul terpisah), pembedanya cuma field "devisi" di tiap Log
  Usage (otomatis kecatet dari email yang input, BUKAN pilihan manual).
- "sudahDihitungFinal": angka-angka yang UDAH final dihitung sistem, JANGAN dihitung ulang pakai
  cara/asumsi sendiri:
  - "highlightUsageKpi": total qty terpakai hari ini/bulan ini/bulan lalu, delta % bulan ini vs bulan
    lalu, jumlah asset yang kesentuh bulan ini, jumlah asset yang stock-nya lagi menipis.
  - "breakdownPemakaianBulanIniPerDevisi": total qty terpakai bulan ini, dipecah SOC vs EHA.
  - "topAssetTerpakaiBulanIni": leaderboard asset paling banyak dipakai bulan ini (diurut tertinggi).
  - "lowStockDetailDenganEstimasiHabisDanSaranReorder": daftar asset yang qty-nya udah ≤ Min Stock
    (kondisi "Menipis"), lengkap sama rata-rata pemakaian/hari (30 hari terakhir), estimasi berapa

- "stockLengkap": SEMUA barang consumable di database Stock apa adanya (bukan cuma yang menipis),
  udah termasuk field "statusStock" ("Menipis"/"Aman") yang SUDAH final, jangan disimpulkan ulang.
- "assetItNcaLengkap": SEMUA aset non-consumable (laptop, meja, kursi, dst) — "jenis" IT atau NCA (Non
  Consumable Asset), "jumlah" cuma relevan/bisa >1 kalau jenisnya NCA (barang IT defaultnya 1 unit per

- "auditLogTerbaru_Max100": 100 log perubahan (Tambah/Edit/Hapus) TERBARU di modul ini, lintas semua

  yang lebih lama dari 100 entri ini, bilang terus terang data yang kekirim cuma 100 log terbaru.

Kalau "stockLengkap" DAN "assetItNcaLengkap" DAN "auditLogTerbaru_Max100" semuanya array kosong, berarti
belum ada data sama sekali di modul ini — bilang terus terang ke user, JANGAN ngarang.

FITUR BARU — kamu sekarang BISA nyiapin AKSI TULIS ke database (Update Stock qty & Submit Usage Log),
TAPI kamu TIDAK PERNAH langsung nyimpen — sistem bakal nampilin KARTU KONFIRMASI ke user dulu, dan
BENERAN kesimpen ke database cuma kalau user klik tombol "Konfirmasi & Simpan" di kartu itu. Tugas kamu
CUMA nyiapin field opsional "inventoryAction" di JSON respons, TAPI CUMA kalau permintaan user JELAS &
TIDAK AMBIGU soal mau nulis/update data (bukan cuma nanya info):
- type "usage_log" — buat "catat pemakaian X sejumlah Y", "submit usage log", "input log pemakaian".
  Field: "items": [{"assetId": "...", "assetName": "...", "qty": angka}], "date": "YYYY-MM-DD" (default
  hari ini kalau gak disebut), "devisi": "SOC"/"EHA" kalau kesebut jelas (kalau enggak, hilangkan field

WAJIB cocokin nama barang yang disebut user ke field "nama" di "stockLengkap" di atas (case-insensitive,
boleh partial match), lalu COPY PERSIS nilai "assetId" dari item "stockLengkap" yang match itu — JANGAN
PERNAH bikin/generate/nebak "assetId" sendiri dengan cara apapun (termasuk nyingkat nama jadi ID, atau
format kayak "-Nxxxx" karangan). Kalau nama yang disebut COCOK ke LEBIH DARI SATU barang (misal user
bilang "Cable Ties" tapi yang ada "Cable Ties Hitam" & "Cable Ties Orange"), ATAU SAMA SEKALI gak ketemu
di stockLengkap, ATAU qty-nya gak jelas/gak disebut — JANGAN sertakan field "inventoryAction" sama
sekali, dan tanya balik ke user lewat "replyLines" biasa sampai jelas. JANGAN PERNAH nebak assetId asal
comot kalau ambigu atau kalau field "assetId"-nya sendiri gak ada di data — salah simpan data itu fatal.

Kalau permintaan user gak nyangkut nulis/update data sama sekali (cuma nanya info biasa), JANGAN
sertakan field "inventoryAction" di JSON respons sama sekali (hilangkan field-nya, jangan ditulis null).

ringkasanInventoryControl (JSON):
${JSON.stringify(invSummary, null, 2)}

${jsonFormatRule}

Contoh jawaban BIASA (nanya info), "replyLines" tetap array, misal: {"replyLines": ["Stock kertas thermal
lagi Menipis bro, sisa 12 roll dari Min Stock 15 — estimasi habis ±4 hari lagi berdasarkan rata-rata
pemakaian, saran reorder +38 roll."], "attachedUnits": []}

Contoh jawaban yang NYIAPIN AKSI TULIS (permintaan jelas & gak ambigu), misal user bilang "tolong input
20 Cable Ties Hitam ke stock": {"replyLines": ["Oke bro, gua siapin buat nambah 20 Cable Ties Hitam ke
Stock — cek kartu konfirmasi di bawah ya sebelum gua simpen."], "attachedUnits": [], "inventoryAction":
{"type": "update_stock", "items": [{"assetId": "-Nabc123", "assetName": "Cable Ties Hitam", "delta": 20,
"expectedNewQty": 45}]}}`);
    }

    if (matchedModules.includes("inbound")){
      moduleBlocks.push(buildInboundModuleText());
    }

    // Gabungin semua blok modul yang cocok jadi satu system prompt. Kalau
    // lebih dari satu modul, dikasih catatan pembuka biar AI-nya gak
    // ngcampur-adukin angka antar modul & tetep nyebut sumbernya masing-masing.
    const crossModuleNote = moduleBlocks.length > 1
      ? `

PENTING: pertanyaan kali ini kesenggol LEBIH DARI SATU modul dashboard sekaligus (` + matchedModules.join(", ") + `). Di
bawah ada beberapa blok instruksi + data, MASING-MASING independen — JANGAN dicampur-adukin angkanya.
Kalau jawabanmu makai angka dari suatu modul, sebutkan modul asalnya biar user gak bingung. Kalau user
emang minta perbandingan/korelasi antar modul, boleh dihubungkan, tapi tetep jujur kalau sumber datanya
beda-beda.`
      : "";
    systemPrompt = `${basePersona}${crossModuleNote}
` + moduleBlocks.join("\n\n===== MODUL LAIN YANG JUGA RELEVAN =====\n");
  } else if (!isDataQuery){
    // Mode RINGAN — obrolan/pertanyaan umum, gak nyangkut data trip. Prompt sengaja
    // dibikin pendek soal instruksi dashboard-nya (biar gak numpuk & bikin AI keder),
    // tapi persona di atas udah nyatain wawasannya luas gak cuma dashboard.
    systemPrompt = `${basePersona}

Pertanyaan kali ini gak nyangkut data trip dashboard. Jawab santai & informatif sesuai konteks obrolan,
pake pengetahuan umum kamu — jangan bilang "gua cuma bisa bantu soal trip" kalau ditanya hal lain,
karena kamu memang bisa bantu topik apa aja.

${jsonFormatRule}

Contoh: {"replyLines": ["Wih nanya gitu bro 😄"], "attachedUnits": []}`;
  } else {
    // Mode LENGKAP (jaring pengaman) — seharusnya sekarang jarang kepake, karena
    // isInboundQuery/classifyModulesWithAI biasanya udah nyantumin "inbound" ke
    // matchedModules di atas duluan. Ini cuma fallback terakhir kalau entah kenapa
    // isDataQuery true tapi gak ada satupun modul yang kedeteksi/di-klasifikasi.
    systemPrompt = `${basePersona}
` + buildInboundModuleText();
  }

  // Gemini pakai format "contents": array {role:"user"|"model", parts:[...]}
  // (BUKAN "assistant" kayak OpenAI/Groq — Gemini pakai "model"). Tiap part
  // bisa {text:"..."} biasa, atau {inline_data:{mime_type, data}} buat gambar
  // (base64 TANPA prefix "data:image/...;base64,", makanya di-strip di bawah).
  // Batasin cuma N pesan TERAKHIR yang dikirim ulang ke API (bukan seluruh riwayat
  // dari awal sesi) — biar prompt gak numpuk makin panjang makin berat tiap turn,
  // yang bikin token per-request membengkak & gampang kena limit di percakapan panjang.
  const HISTORY_LIMIT = 12;
  const recentHistory = chatHistory.slice(-HISTORY_LIMIT);
  function toGeminiParts(content){
    if (Array.isArray(content)){
      return content.map(part => {
        if (part && part.type === "image_url"){
          const url = (part.image_url && part.image_url.url) || "";
          const match = url.match(/^data:([^;]+);base64,(.+)$/);
          return match
            ? { inline_data: { mime_type: match[1], data: match[2] } }
            : { text: "" };
        }
        return { text: String((part && part.text) || "") };
      });
    }
    return [{ text: String(content || "") }];
  }
  const contentsForApi = recentHistory.map(m => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: toGeminiParts(m.content)
  }));

  try{
    // Panggil lewat Netlify Function proxy (bukan langsung ke Gemini) supaya
    // API key gak pernah ke-expose di browser. Lihat netlify/functions/gemini-proxy.js
    // Model (termasuk dukungan vision buat gambar) udah ditentuin di sisi proxy
    // (GEMINI_MODEL_CHAIN) — model Gemini flash-nya udah multimodal jadi gak
    // perlu ganti model/parameter khusus kalau ada gambar terlampir. Kalau
    // user milih model tertentu di dropdown (bukan "Auto"), kirim sebagai
    // preferred_model — proxy bakal nyoba model itu duluan, tapi tetep
    // fallback ke chain default kalau model itu kena rate limit.
    const modelSelectEl = document.getElementById("modelSelect");
    const preferredModel = modelSelectEl ? modelSelectEl.value : "";
    const requestBodyBase = {
      max_tokens: isDataQuery ? 3000 : 1500, // mode report dikasih jatah lebih gede
      // Level thinking: mode data (trip JSON / DW report) butuh AI teliti nyisir
      // data satu-satu DAN gak kebawa topik riwayat obrolan sebelumnya (misal abis
      // ditanya report DW, terus ditanya Late Arrival trip — pernah kejadian
      // AI ke-distract & jawabannya asal gara-gara "minimal" kekurangan mikir).
      // Obrolan santai tetep "minimal" biar hemat token/latency.
      thinking_level: isDataQuery ? "low" : "minimal",
      system: systemPrompt,
      contents: contentsForApi
    };

    // --- Loop retry sisi klien -------------------------------------------
    // Proxy (gemini-proxy.js) UDAH otomatis ganti model kalau kena rate limit
    // (429/RESOURCE_EXHAUSTED) — itu ke-handle di server, satu request aja
    // cukup. TAPI ada kasus lain yang gak ke-detect proxy: model-nya JAWAB
    // (status 200, bukan rate limit) tapi isinya BUKAN JSON valid (paling
    // sering kejadian di model "lite" yang kurang nurut instruksi format).
    // Ini gak bisa di-fix di server karena proxy gak ngerti skema JSON
    // aplikasi (replyLines/attachedUnits). Jadi retry-nya di sini: kalau
    // parse gagal, otomatis coba ulang pakai model LAIN di chain (bukan
    // model yang barusan gagal) sampai maxAttempts kali, sebelum akhirnya
    // nyerah & nampilin pesan "berantakan" ke user.
    const maxAttempts = 3;
    const usedModels = [];
    let attemptModel = preferredModel;
    let data, ok = false, parsed, text = "", rawModelUsed = "";

    for (let attemptNum = 1; attemptNum <= maxAttempts; attemptNum++){
      const requestBody = Object.assign({}, requestBodyBase);
      if (attemptModel) requestBody.preferred_model = attemptModel;

      const response = await fetch("/.netlify/functions/gemini-proxy", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(requestBody)
      });
      const rawText = await response.text();
      try{
        data = rawText ? JSON.parse(rawText) : {};
      }catch(e){
        throw new Error("Server balikin respons non-JSON (kemungkinan function belum ke-deploy atau crash). Cuplikan: " + rawText.slice(0,150));
      }
      if (!response.ok){
        throw new Error((data && data.error && data.error.message) ? data.error.message : ((data && data.error) ? data.error : ("HTTP " + response.status + " (respons kosong)")));
      }
      // Gemini balikin "candidates" (bukan "choices" kayak OpenAI/Groq). Kalau
      // jawaban keblokir safety filter, candidates bisa kosong & alasannya ada
      // di promptFeedback.blockReason.
      const candidate = (data.candidates && data.candidates[0]) || null;
      if (!candidate && data.promptFeedback && data.promptFeedback.blockReason){
        throw new Error("blockReason: " + data.promptFeedback.blockReason);
      }
      const partsText = candidate && candidate.content && Array.isArray(candidate.content.parts)
        ? candidate.content.parts.map(p => (p && p.text) || "").join("")
        : "";
      text = partsText.trim();
      // Bersihin code fence di mana pun posisinya (bukan cuma di awal/akhir persis)
      text = text.replace(/```json/gi, "").replace(/```/g, "").trim();

      // Ambil substring dari kurung kurawal PERTAMA sampai kurung kurawal
      // TERAKHIR — jadi kalau AI masih nyelipin kalimat pembuka/penutup di luar
      // JSON (padahal udah dilarang), itu gak bikin JSON.parse langsung gagal.
      const firstBrace = text.indexOf("{");
      const lastBrace = text.lastIndexOf("}");
      if (firstBrace !== -1 && lastBrace > firstBrace){
        text = text.slice(firstBrace, lastBrace + 1);
      }

      // Coba parse langsung dulu. Kalau AI-nya (Gemini) masih ngasal — misal nulis
      // enter/tab literal, over-escape jadi "\\n" dobel, pakai tanda kutip
      // "pintar" (smart quotes), atau nyisain trailing comma — di dalam string
      // JSON, JSON.parse bisa gagal atau kebaca aneh.
      const attempts = [
        text,
        text.replace(/\r\n|\r|\n/g, "\\n").replace(/\t/g, "\\t"), // newline/tab literal -> escaped
        text.replace(/\\\\n/g, "\\n").replace(/\\\\t/g, "\\t"),    // over-escaped \\n -> \n
        text.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"'), // smart quotes -> lurus
        text.replace(/,\s*([\]}])/g, "$1")                         // hapus trailing comma sebelum ] / }
      ];
      for (const candidateText of attempts){
        try{ parsed = JSON.parse(candidateText); ok = true; break; }
        catch(e){ /* coba kandidat berikutnya */ }
      }

      rawModelUsed = (data && (data.modelUsed || data.model)) || attemptModel || "";
      if (rawModelUsed) usedModels.push(rawModelUsed);

      if (ok) break; // sukses, gak perlu retry ke model lain

      // Parse gagal -> siapin model lain buat percobaan berikutnya (kalau
      // masih ada jatah attempt & masih ada model yang belum dicoba).
      const nextModel = ODYSSEY_MODEL_CHAIN.find(m => !usedModels.includes(m));
      if (!nextModel || attemptNum === maxAttempts) break;
      attemptModel = nextModel;
    }

    // Last resort kalau SEMUA percobaan (termasuk ganti-ganti model) tetep
    // gagal: jangan lempar mentahan JSON ke chat — tarik isi array
    // "replyLines" pakai regex biar user tetap dapet teks yang bisa dibaca
    // manusia dulu, sebelum bener-bener nyerah ke pesan "berantakan".
    if (!ok){
      const linesMatch = text.match(/"replyLines"\s*:\s*\[([\s\S]*?)\]\s*,\s*"attachedUnits"/);
      if (linesMatch){
        const items = [];
        const itemRegex = /"((?:[^"\\]|\\.)*)"/g;
        let m;
        while ((m = itemRegex.exec(linesMatch[1])) !== null){
          items.push(m[1].replace(/\\n/g, "\n").replace(/\\"/g, '"'));
        }
        if (items.length){ parsed = { replyLines: items, attachedUnits: [] }; ok = true; }
      }
    }
    if (!ok) parsed = { replyLines: ["Waduh, format balasan AI-nya berantakan bro, udah gua coba ganti-ganti model tapi tetep gagal — coba tanya ulang sekali lagi ya."], attachedUnits: [] };

    // Susun teks final dari array replyLines (baris baru beneran, bukan hasil
    // escape dari AI) — kalau AI masih pakai format lama "reply" (string biasa),
    // tetap didukung biar gak putus kompatibilitas.
    let replyText = "...";
    if (Array.isArray(parsed.replyLines)){
      replyText = parsed.replyLines.map(l => String(l)).join("\n");
    } else if (typeof parsed.reply === "string"){
      replyText = parsed.reply;
    }

    // Label model yang jawab: pakai model TERAKHIR yang beneran sukses jawab
    // (bisa beda dari pilihan dropdown user kalau proxy fallback rate-limit
    // ATAU loop retry di atas ganti model gara-gara output berantakan), atau
    // "Auto" kalau dropdown-nya "Auto" & gak ada info model dari proxy.
    // Selalu lewat friendlyModelName() biar nama vendor/tier asli
    // (Gemini/Flash/Flash Lite) gak pernah nongol di UI.
    const modelLabel = friendlyModelName(rawModelUsed || preferredModel);

    removeTyping();
    addMessage("agent", replyText, parsed.attachedUnits, null, modelLabel);
    chatHistory.push({role:"assistant", content: replyText});
    scheduleSaveSession();

    // Kalau Gemini nyiapin rencana aksi tulis (Update Stock / Submit Usage Log) buat modul Inventory
    // Control, tampilin kartu konfirmasi — TIDAK ADA yang kesimpen ke Firebase sebelum user klik
    // "Konfirmasi & Simpan" di kartu itu.
    if (parsed.inventoryAction && Array.isArray(parsed.inventoryAction.items) && parsed.inventoryAction.items.length){
      renderInventoryActionConfirmCard(parsed.inventoryAction);
    }
    if (parsed.restAction && parsed.restAction.type && parsed.restAction.opsId){
      renderRestActionConfirmCard(parsed.restAction);
    }
  }catch(e){
    console.error(e);
    removeTyping();
    addMessage("agent", simplifyErrorMessage(e.message));
  }
}

// ===== Attach gambar via paste (Ctrl+V) =====
let pendingImageDataUrl = null;

function setPendingImage(dataUrl){
  pendingImageDataUrl = dataUrl;
  const row = document.getElementById("imgPreviewRow");
  const thumb = document.getElementById("imgPreviewThumb");
  thumb.src = dataUrl;
  row.classList.add("show");
}
function clearPendingImage(){
  pendingImageDataUrl = null;
  const row = document.getElementById("imgPreviewRow");
  row.classList.remove("show");
  document.getElementById("imgPreviewThumb").src = "";
}
function handlePasteEvent(e){
  const items = (e.clipboardData || e.originalEvent && e.originalEvent.clipboardData || {}).items;
  if (!items) return;
  for (const item of items){
    if (item.type && item.type.indexOf("image") !== -1){
      const file = item.getAsFile();
      if (!file) continue;
      const reader = new FileReader();
      reader.onload = (ev) => setPendingImage(ev.target.result);
      reader.readAsDataURL(file);
      e.preventDefault();
      break;
    }
  }
}
document.getElementById("chatInput").addEventListener("paste", handlePasteEvent);
document.getElementById("removeImgBtn").addEventListener("click", clearPendingImage);

// commitSend() dipakai bareng sama tombol Kirim, tombol Enter, dan pemilihan
// command dari Command Palette (biar logic "harus ada teks ATAU gambar" +
// clear pending image gak keduplikasi di beberapa tempat).
function commitSend(text){
  const q = (text || "").trim();
  if (!q && !pendingImageDataUrl) return; // minimal harus ada teks ATAU gambar
  const img = pendingImageDataUrl;
  clearPendingImage();
  askAgent(q, img);
}
document.getElementById("sendBtn").addEventListener("click", () => {
  const input = document.getElementById("chatInput");
  const q = input.value;
  input.value = "";
  hideCmdPalette();
  commitSend(q);
});
document.getElementById("chatInput").addEventListener("keydown", (e) => {

  if (e.key === "Enter") document.getElementById("sendBtn").click();
});

});

}
