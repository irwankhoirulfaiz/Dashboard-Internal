<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Odyssey — Inbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase SDK — sama persis pola yang dipakai di inbound.html / outbound.html.
     auth-guard.js yang nyimpen firebaseConfig asli & handle login redirect.
     Taruh file ini di folder project yang SAMA dengan auth-guard.js biar konek otomatis.
     Chat AI-nya manggil Google Gemini API lewat proxy Netlify Function di
     netlify/functions/gemini-proxy.js — API key disimpan aman di server
     (env variable GEMINI_API_KEY), gak pernah ke-expose di browser. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<!-- Markdown render + syntax highlight blok kode. Dipakai buat nge-render
     balasan agent (bold/italic/list/link/code fence) jadi HTML beneran,
     bukan teks polos kayak sebelumnya. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

<style>
  :root{
    --bg:#10141A; --panel:#171D26; --panel-2:#1E2530; --line:#2B3341;
    --text:#E7EAEE; --muted:#8B93A1; --amber:#E8A33D; --cyan:#4FD1C5; --red:#E4604D;
    --paper:#F4F1E9; --paper-ink:#23201A; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif;
    height:100vh; overflow:hidden; padding:16px 24px; display:flex; justify-content:center;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:none; width:100%; display:flex; flex-direction:column; height:calc(100vh - 32px);}

  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:14px; flex-wrap:wrap; gap:8px;
  }
  header .title{font-size:20px; font-weight:600; letter-spacing:-.01em;}
  header .title span{color:var(--amber);}
  header .sub{display:none;}

  .topbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:10px 12px; margin-bottom:14px; font-size:13px;
  }
  .topbar label{color:var(--muted); font-size:12px;}
  .topbar input[type=date]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:6px 8px; border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:12px;
  }
  .topbar .stat{display:none;}
  .topbar .stat b{color:var(--text);}
  .switch{position:relative; width:34px; height:18px; flex:none;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .slider{position:absolute; inset:0; background:#39424F; border-radius:20px; cursor:pointer; transition:.15s;}
  .slider:before{content:""; position:absolute; height:12px; width:12px; left:3px; top:3px; background:var(--text); border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--cyan);}
  .switch input:checked + .slider:before{transform:translateX(16px); background:#0D1A18;}
  .spacer{flex:1;}
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .icon-btn:hover{color:var(--cyan); border-color:var(--cyan);}

  .chat-panel{
    flex:1; display:flex; flex-direction:column; background:var(--panel);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  #chatLog{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px;}
  /* Scrollbar chat dibikin tipis & nyatu sama tema gelap, bukan scrollbar
     tebal default browser yang norak nongol di kanan. */
  #chatLog{scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
  #chatLog::-webkit-scrollbar{width:6px;}
  #chatLog::-webkit-scrollbar-track{background:transparent;}
  #chatLog::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
  #chatLog::-webkit-scrollbar-thumb:hover{background:var(--muted);}

  /* --chat-msg-max-width & --chat-font-size diatur dari JS (panel Setting),
     nilai di sini cuma fallback default kalau user belum pernah ngatur apa-apa. */
  .msg{max-width:var(--chat-msg-max-width, min(78%, 720px)); display:flex; flex-direction:column; gap:6px;
    animation:msgIn .28s cubic-bezier(.34,1.2,.64,1) both;}
  @keyframes msgIn{
    0%{opacity:0; transform:translateY(10px) scale(.98);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .msg.user{align-self:flex-end; align-items:flex-end;}
  .msg.agent{align-self:flex-start; align-items:flex-start;}
  .msg-row{display:flex; align-items:flex-end; gap:8px;}
  .msg.user .msg-row{flex-direction:row-reverse;}
  .avatar{
    width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center;
    justify-content:center; font-size:13px; font-weight:700; overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar.avatar-agent{background:linear-gradient(135deg,var(--amber),var(--red)); color:#241704;}
  .avatar.avatar-user{background:var(--panel-2); border:1px solid var(--line); color:var(--cyan);}
  .bubble{padding:10px 14px; border-radius:14px; font-size:var(--chat-font-size, 14px); line-height:1.5; white-space:pre-wrap;}
  .msg.user .bubble{background:var(--amber); color:#241704; border-bottom-right-radius:4px;}
  .msg.agent .bubble{background:var(--panel-2); border:1px solid var(--line); border-bottom-left-radius:4px; white-space:normal;}
  .msg .who{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .model-badge{
    font-size:9px; text-transform:none; letter-spacing:0; background:var(--panel-2);
    border:1px solid var(--line); color:var(--cyan); padding:1px 7px; border-radius:20px; font-weight:600;
  }
  .typewriter-cursor{display:inline-block; width:2px; height:13px; background:var(--cyan); margin-left:2px; vertical-align:-2px; animation:caretBlink .8s step-end infinite;}
  @keyframes caretBlink{0%,100%{opacity:1;}50%{opacity:0;}}

  /* ===== Markdown rendering di dalam bubble agent ===== */
  .bubble p{margin:0 0 8px;}
  .bubble p:last-child{margin-bottom:0;}
  .bubble strong{color:#fff;}
  .bubble a{color:var(--cyan);}
  .bubble ul, .bubble ol{margin:4px 0 8px; padding-left:20px;}
  .bubble li{margin:2px 0;}
  .bubble code{background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .bubble pre{background:#0d1117; border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow-x:auto; margin:6px 0;}
  .bubble pre code{background:transparent; padding:0; font-size:12.5px; line-height:1.5;}

  /* ===== Quick-reply shortcut chips ===== */
  .quick-replies{display:flex; flex-wrap:wrap; gap:6px; align-self:flex-start; max-width:100%;}
  .quick-reply-chip{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit;
    transition:.15s;
  }
  .quick-reply-chip:hover{border-color:var(--amber); color:var(--amber);}

  /* ===== Mini header chat: avatar + judul + New Chat ===== */
  .chat-header{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .chat-header .chat-header-title{font-size:13px; font-weight:700; flex:1;}
  .chat-header .chat-header-title .brand-the{color:var(--text);}
  .chat-header .chat-header-title .brand-odyssey{color:var(--amber);}
  .chat-header .chat-header-sub{font-size:10px; color:var(--muted); font-weight:400;}
  .new-chat-btn{
    display:flex; align-items:center; gap:5px; background:transparent; border:1px solid var(--line);
    color:var(--muted); border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer; font-family:inherit;
  }
  .new-chat-btn:hover{color:var(--red); border-color:var(--red);}

  /* ===== Lightbox gambar in-app ===== */
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(10,13,18,.88); z-index:99999;
    display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;
  }
  .lightbox-overlay.show{display:flex; animation:lbFade .15s ease-out both;}
  @keyframes lbFade{from{opacity:0;}to{opacity:1;}}
  .lightbox-overlay img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); cursor:default;}
  .lightbox-close{
    position:absolute; top:16px; right:20px; background:transparent; border:1px solid var(--line);
    color:var(--text); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer;
  }

  .copy-btn{
    align-self:flex-start; display:inline-flex; align-items:center; gap:5px;
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:3px 9px; font-size:11px; cursor:pointer; font-family:inherit;
    transition:.15s;
  }
  .copy-btn:hover{color:var(--cyan); border-color:var(--cyan);}
  .copy-btn.copied{color:var(--cyan); border-color:var(--cyan);}

  .msg-actions{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .explain-panel, .details-panel{width:100%; max-width:100%;}
  .explain-panel .inner, .details-panel .inner{white-space:normal;}

  .attach-card{
    background:var(--paper); color:var(--paper-ink); border-radius:8px;
    padding:12px 14px; font-size:12px; width:100%; max-width:100%; overflow-x:auto;
  }
  .attach-card table{width:100%; border-collapse:collapse;}
  .attach-card th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    color:#8A8368; padding:4px 6px; border-bottom:1px solid #DDD7C6; white-space:nowrap;
  }
  .attach-card td{padding:5px 6px; border-bottom:1px solid #ECE7D8; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  .attach-card tr:last-child td{border-bottom:none;}
  .badge{display:inline-block; padding:1px 7px; border-radius:20px; font-size:10px; font-family:'IBM Plex Sans',sans-serif; font-weight:600;}
  .badge-late{background:rgba(228,96,77,.15); color:#C6482F;}
  .badge-early{background:rgba(45,150,140,.15); color:#237A70;}
  .badge-ontime{background:rgba(139,147,161,.2); color:#5B6472;}
  .badge-transit{background:rgba(232,163,61,.18); color:#B4761A;}

  .typing{font-size:12px; color:var(--muted); font-style:italic; padding-left:4px;}
  .typing-dots{display:inline-flex; align-items:center; gap:4px; padding:6px 4px;}
  .typing-dots span{
    width:6px; height:6px; border-radius:50%; background:var(--muted);
    animation:typingBounce 1.2s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1){animation-delay:-0.24s;}
  .typing-dots span:nth-child(2){animation-delay:-0.12s;}
  .typing-dots span:nth-child(3){animation-delay:0s;}
  @keyframes typingBounce{
    0%, 80%, 100%{transform:scale(.6); opacity:.4;}
    40%{transform:scale(1); opacity:1;}
  }

  .chat-input-row{
    position:relative;
    display:flex; flex-direction:column; gap:8px; padding:12px; border-top:1px solid var(--line); background:var(--panel);
  }

  /* ===== Command Bar / AI Command Palette (slash commands + ⌘K) ===== */
  .cmd-palette{
    position:absolute; left:12px; right:12px; bottom:100%; margin-bottom:10px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:6px; box-shadow:0 12px 28px rgba(0,0,0,.4); max-height:280px; overflow-y:auto;
    display:none; z-index:20;
  }
  .cmd-palette.show{display:block;}
  .cmd-palette-hint{
    font-size:10px; color:var(--muted); padding:6px 10px 8px; letter-spacing:.05em; text-transform:uppercase;
  }
  .cmd-palette-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer;
  }
  .cmd-palette-item:hover, .cmd-palette-item.active{background:var(--panel);}
  .cmd-palette-item .cmd-icon{font-size:16px; flex:none; width:22px; text-align:center;}
  .cmd-palette-item .cmd-text{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .cmd-palette-item .cmd-name{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--cyan); font-weight:600;
  }
  .cmd-palette-item .cmd-desc{
    font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .model-select-row{display:flex; justify-content:flex-end;}
  .model-select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-color:var(--panel-2); color:var(--muted); border:1px solid var(--line);
    border-radius:20px; padding:5px 26px 5px 12px; font-size:11px; font-family:inherit;
    cursor:pointer; max-width:100%;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a93a1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 8px center; background-size:12px;
  }
  .model-select:focus{outline:none; border-color:var(--amber); color:var(--text);}
  .chat-input-inner{display:flex; gap:8px;}
  .chat-input-inner input{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 14px; border-radius:20px; font-size:14px; font-family:inherit;
  }
  .chat-input-inner input:focus{outline:none; border-color:var(--amber);}
  .chat-input-inner button{
    background:var(--amber); color:#241704; border:none; border-radius:20px;
    padding:0 20px; font-weight:600; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .chat-input-inner button:disabled{opacity:.5; cursor:default;}

  .img-preview-row{display:none; align-items:center; gap:10px; padding:4px 4px 0;}
  .img-preview-row.show{display:flex;}
  .img-preview-row .thumb-wrap{position:relative; width:52px; height:52px; flex:none;}
  .img-preview-row img{width:52px; height:52px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block;}
  .img-preview-row .remove-img{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--red); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .img-preview-row .hint{font-size:11px; color:var(--muted);}

  .msg-image{max-width:220px; border-radius:10px; border:1px solid var(--line); display:block; cursor:zoom-in;}

  details.note-details{margin-top:12px; font-size:12px; color:var(--muted);}
  details.note-details summary{cursor:pointer; color:var(--cyan);}
  details.note-details .inner{padding:10px 2px 2px; line-height:1.6;}
  details.note-details code{background:var(--panel-2); padding:1px 5px; border-radius:4px; font-family:'IBM Plex Mono',monospace;}

  /* ===== Row utama: sidebar riwayat sesi (kiri) + chat-panel (kanan) =====
     Sengaja dipisah dari .wrap (yang tetep flex-column) biar chat-panel
     LAMA gak keganggu struktur/CSS-nya — cuma dibungkus sejajar sama
     sidebar baru. Sidebar defaultnya ketutup (class "hidden") biar area
     chat tetep full kepake kayak sebelumnya, user tinggal klik tombol
     "Riwayat" di header buat buka/tutup. */
  .main-row{flex:1; display:flex; gap:12px; min-height:0;}
  .sessions-sidebar{
    width:220px; flex:none; display:flex; flex-direction:column; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; overflow:hidden;
  }
  .sessions-sidebar.hidden{display:none;}
  .sessions-sidebar-header{
    display:flex; align-items:center; justify-content:space-between;
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;
  }
  .sessions-sidebar-header button{
    background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px;
  }
  .sessions-sidebar-header button:hover{color:var(--red);}
  .new-session-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:8px;
    padding:8px 10px; font-size:12px; cursor:pointer; font-family:inherit; text-align:left;
  }
  .new-session-btn:hover{border-color:var(--amber); color:var(--amber);}
  .sessions-list{
    flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .sessions-list::-webkit-scrollbar{width:6px;}
  .sessions-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
  .session-item{
    display:flex; flex-direction:column; gap:2px; padding:8px 9px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; background:transparent; text-align:left; font-family:inherit; width:100%;
  }
  .session-item:hover{background:var(--panel-2);}
  .session-item.active{background:var(--panel-2); border-color:var(--cyan);}
  .session-item .session-title{
    font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .session-item .session-meta{font-size:10px; color:var(--muted);}
  .sessions-empty{font-size:11px; color:var(--muted); padding:8px 4px; line-height:1.5;}

  /* ===== Tombol-tombol aksi tambahan di chat-header (Riwayat/Sound/Setting) ===== */
  .header-actions{display:flex; align-items:center; gap:6px; position:relative;}

  /* ===== Popover Setting (ukuran font & lebar chat) ===== */
  .settings-popover{
    position:absolute; top:36px; right:0; background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; padding:12px; width:190px; z-index:50; display:none; flex-direction:column; gap:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .settings-popover.show{display:flex;}
  .settings-popover .field label{
    font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;
    display:block; margin-bottom:4px;
  }
  .settings-popover select{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 8px; font-size:12px; font-family:inherit; cursor:pointer;
  }
  .settings-popover select:focus{outline:none; border-color:var(--amber);}
</style>
</head>
<body>
<div class="wrap">

  <!-- Header "The Odyssey" DIHAPUS dari sini — judulnya sekarang cuma
       ditampilin sekali di title bar popup (index.html), biar area di bawah
       ini (chat-panel) bisa FULL kepake buat percakapan, gak keulang 2x.
       #statusLine ("mode: mock data") masih dipertahanin di script bawah
       lewat elemen tersembunyi biar kode JS yang nulis ke situ gak error
       karena elemen ilang. -->
  <div class="sub" id="statusLine" style="display:none;">mode: mock data</div>

  <!-- Topbar (stat "N trip tercatat" + tombol "Refresh Data") juga DISEMBUNYIIN
       dari sini — tombol "Refresh Data"-nya udah dipindah ke title bar popup
       di index.html (biar sebaris sama "The Odyssey"), dan klik di sana
       nge-postMessage ke sini (lihat listener "odysseyRefresh" di script
       bawah) buat manggil loadData() yang sama persis. Elemen-elemen di
       dalam sini dibiarin tetep ada (bukan dihapus) biar kode JS yang masih
       nulis ke situ (quickStat, refreshBtn) gak error. -->
  <div class="topbar" style="display:none;">
    <span class="stat" id="quickStat"><b>0</b> trip tercatat</span>
    <div class="spacer"></div>
    <button class="icon-btn" id="refreshBtn">Refresh Data</button>
  </div>

  <div class="main-row">
    <!-- Sidebar riwayat sesi chat — default ketutup (lihat class "hidden"), dibuka
         lewat tombol 🗂 di header biar area chat gak keambil ruang kalau gak dipake.
         Isinya di-fetch dari Firebase (per-user, lihat ODYSSEY_CHAT_ROOT di script). -->
    <div class="sessions-sidebar hidden" id="sessionsSidebar">
      <div class="sessions-sidebar-header">
        <span>Riwayat Chat</span>
        <button type="button" id="closeSidebarBtn" title="Tutup riwayat">✕</button>
      </div>
      <button class="new-session-btn" id="newSessionBtn" type="button">+ Chat Baru</button>
      <div id="sessionsList" class="sessions-list">
        <div class="sessions-empty">Memuat riwayat…</div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-header">
        <div class="avatar avatar-agent" id="chatHeaderAvatar"></div>
        <div class="chat-header-title"><span class="brand-the">The</span> <span class="brand-odyssey">Odyssey</span><div class="chat-header-sub">AI Agent — Palangka Raya DC</div></div>
        <div class="header-actions">

// "logs" & "assetLogs" dibatasin MON_WINDOW_DAYS hari terakhir (sama kayak
// window yang ditampilin rest-time.html sendiri) biar dump JSON ke AI gak
// membengkak nyeret histori lama yang gak relevan buat pertanyaan real-time.
function getMonWindowStartDate(){
  const d = new Date();
  d.setDate(d.getDate() - MON_WINDOW_DAYS);
  return formatDateYYYYMMDDLocal(d);
}
function fetchRestAssetData(){
  return new Promise((resolve, reject) => {
    if (!window.firebase || !firebase.apps || !firebase.apps.length){
      reject(new Error("Firebase belum ke-init (auth-guard.js gak ketemu / belum login)"));
      return;
    }
    if (!firebase.auth().currentUser){
      reject(new Error("Belum login — buka file ini lewat app shell / login dulu"));
      return;
    }
    const db = firebase.database();
    const startDate = getMonWindowStartDate();
    Promise.all([
      db.ref(MON_LOGS_PATH).orderByChild("workingDate").startAt(startDate).once("value"),
      db.ref(MON_ASSET_PATH).orderByChild("workingDate").startAt(startDate).once("value"),
      db.ref(MON_MASTER_PATH).once("value"),
      db.ref(MON_STATION_PATH).once("value")
    ]).then(([logsSnap, assetSnap, masterSnap, stationSnap]) => {
      const logsVal = logsSnap.val() || {};
      const assetVal = assetSnap.val() || {};
      resolve({
        // "_key" WAJIB disertain (dulu kebuang) — dipakai buat nyari-balik entry Firebase asli pas ada
        // aksi Edit Jam / Delete Activity dari Odyssey. AI TETAP gak pernah disuruh nebak "_key" ini
        // sendiri (beda dari kasus assetId Stock) — sistem yang nyari entry-nya lewat opsId+tanggal
        // pas eksekusi, _key ini cuma dipakai internal buat targetin update/remove-nya.
        logs: Object.keys(logsVal).map(k => Object.assign({ _key: k }, logsVal[k])),
        assetLogs: Object.keys(assetVal).map(k => Object.assign({ _key: k }, assetVal[k])),
        master: masterSnap.val() || {},
        stationMap: stationSnap.val() || {}

  });
}

// ================= REST TIME & ASSET USAGE - HELPER & AKSI TULIS (dari Odyssey) =================
// parseDateTime niru PERSIS fungsi sama persis di rest-time.html (format "YYYY-MM-DD HH:mm:ss", lokal
// WIB, BUKAN ISO/UTC) — dipakai bareng buat hitung durasi statusLiveTerkini di bawah.
function monParseDateTime(str){
  if (!str) return null;
  const t = String(str).split(/[- :]/);
  return new Date(t[0], t[1]-1, t[2], t[3]||0, t[4]||0, t[5]||0);
}

// Hitung 2 status live yang paling sering ditanya, DI SINI (JS) — bukan diserahin ke AI — niru persis
// checkRestOvertimeAlert() (>60 menit) & getActiveAssetLock()/last-action check (PDA belum kembali) di
// rest-time.html, biar jawabannya selalu konsisten sama yang ditampilin dashboard aslinya.
function computeRestAssetLiveStatus(logs, assetLogs, master, stationMap){
  const now = new Date();

  // --- Operator yang lagi Break Out & udah >60 menit ---
  const byOpsRest = {};
  logs.forEach(function (l) { (byOpsRest[l.opsId] = byOpsRest[l.opsId] || []).push(l); });
  const operatorIstirahatLebih60Menit = [];
  Object.keys(byOpsRest).forEach(function (opsId) {
    const arr = byOpsRest[opsId].slice().sort(function (a, b) { return monParseDateTime(a.timestamp) - monParseDateTime(b.timestamp); });
    const last = arr[arr.length - 1];
    if (last && last.breakType === "Break Out"){
      const breakOutTime = monParseDateTime(last.timestamp);
      const durasiMenit = Math.floor((now - breakOutTime) / 60000);
      if (durasiMenit > 60){
        const u = master[opsId] || {};
        operatorIstirahatLebih60Menit.push({
          opsId: opsId, nama: u.name || "(tanpa nama)", dept: u.dept || "-", agency: u.agency || "-",
          jamBreakOut: last.timestamp, durasiMenit: durasiMenit
        });
      }
    }
  });
  operatorIstirahatLebih60Menit.sort(function (a, b) { return b.durasiMenit - a.durasiMenit; });

  // --- PDA yang aksi terakhirnya "Pinjam PDA" (belum "Kembali PDA") ---
  const byAssetSn = {};
  assetLogs.forEach(function (l) { (byAssetSn[l.serialNumber] = byAssetSn[l.serialNumber] || []).push(l); });
  const belumKembaliFlat = [];
  Object.keys(byAssetSn).forEach(function (sn) {
    const arr = byAssetSn[sn].slice().sort(function (a, b) { return monParseDateTime(a.timestamp) - monParseDateTime(b.timestamp); });
    const last = arr[arr.length - 1];
    if (last && last.action === "Pinjam PDA"){
      const u = master[last.opsId] || {};
      const pinjamTime = monParseDateTime(last.timestamp);
      belumKembaliFlat.push({
        station: stationMap[sn] || "(station tidak diketahui)", serialNumber: sn, last5Sn: last.last5Sn || sn.slice(-5),
        opsId: last.opsId, namaPeminjam: u.name || "(tanpa nama)", jamPinjam: last.timestamp,
        durasiJam: Number(((now - pinjamTime) / 3600000).toFixed(1))
      });
    }
  });
  const pdaBelumKembaliPerStation = {};
  belumKembaliFlat.forEach(function (it) { (pdaBelumKembaliPerStation[it.station] = pdaBelumKembaliPerStation[it.station] || []).push(it); });

  return {
    catatan: "operatorIstirahatLebih60Menit & pdaBelumKembaliPerStation UDAH final dihitung sistem persis kayak alert dashboard, JANGAN dihitung ulang.",
    operatorIstirahatLebih60Menit: operatorIstirahatLebih60Menit,
    pdaBelumKembaliPerStation: pdaBelumKembaliPerStation
  };
}

// Edit Jam by OpsID — niru persis makeTimeEditable() di rest-time.html: kalau entry breakType itu udah
// ada di tanggal itu, UPDATE timestamp-nya; kalau belum pernah ada sama sekali, BIKIN BARU (cycleNum
// default 1, sama kayak perilaku "Input Manual" di dashboard aslinya).
async function monUpdateLogTime(opsId, breakType, dateStr, newTime){
  const db = firebase.database();
  const targetLog = currentRestLogs.find(function (l) { return l.opsId === opsId && l.workingDate === dateStr && l.breakType === breakType; });
  const newTimestamp = dateStr + " " + newTime + ":00";
  if (targetLog){
    await db.ref(MON_LOGS_PATH + "/" + targetLog._key).update({ timestamp: newTimestamp });
  } else {
    const newKey = db.ref(MON_LOGS_PATH).push().key;
    await db.ref(MON_LOGS_PATH + "/" + newKey).set({ opsId: opsId, breakType: breakType, timestamp: newTimestamp, workingDate: dateStr, cycleNum: 1 });
  }
}

// Delete Activity — niru persis removeOpsIdLog() di rest-time.html: hapus SEMUA log opsId itu di
// tanggal itu, buat modul "rest" (Rest Time) ATAU "asset" (Asset Usage PDA). WAJIB dicek
// window.__authCanDelete DULU (Firebase Rules-nya emang butuh whitelist admin buat delete — beda dari
// create/update yang kebuka buat semua user authenticated).
async function monDeleteActivity(opsId, dateStr, module){
  if (!window.__authCanDelete){
    throw new Error("Kamu gak punya akses buat hapus data di modul ini (cuma admin tertentu yang bisa). Hubungi admin kalau ini kesalahan.");
  }
  const db = firebase.database();
  const path = module === "asset" ? MON_ASSET_PATH : MON_LOGS_PATH;
  const source = module === "asset" ? currentAssetLogs : currentRestLogs;
  const matched = source.filter(function (l) { return l.opsId === opsId && l.workingDate === dateStr; });
  if (!matched.length) throw new Error("Gak ada aktivitas " + opsId + " tanggal " + dateStr + " di modul ini — mungkin udah kehapus / salah tanggal.");
  const updates = {};
  matched.forEach(function (l) { updates[path + "/" + l._key] = null; });
  await db.ref().update(updates);
  return matched.length;
}

    lines.push("• ⚠️ Aksi ini HAPUS SEMUA aktivitas opsId ini di tanggal itu, gak bisa dibatalin lagi.");
    if (!window.__authCanDelete){ hasInvalidItem = true; lines.push("• 🚫 Kamu gak punya akses hapus data (cuma admin tertentu)."); }
  } else {

    okBtn.disabled = true; cancelBtn.disabled = true; okBtn.textContent = "⏳ Memproses...";

      if (!firebase.auth().currentUser) throw new Error("Belum login.");
      if (isDelete){

        title.textContent += " — " + count + " entry terhapus ✅";
      } else {
        await monUpdateLogTime(action.opsId, action.breakType, action.date, action.newTime);
        title.textContent += " — Tersimpan ✅";
      }
      try{
        const fresh = await fetchRestAssetData();
        currentRestLogs = fresh.logs; currentAssetLogs = fresh.assetLogs;
        monMasterKaryawan = fresh.master; monPdaStationMap = fresh.stationMap;
      }catch(e){ /* gagal refresh gak fatal */ }
      btnRow.remove();
      chatHistory.push({ role: "assistant", content: "[" + title.textContent + "]" });
      scheduleSaveSession();
      playChatSound("received");
    }catch(e){
      console.error(e);
      okBtn.disabled = !!hasInvalidItem; cancelBtn.disabled = false;
      okBtn.textContent = isDelete ? "✅ Ya, Hapus" : "✅ Konfirmasi & Simpan";
      const errLine = document.createElement("div");
      errLine.style.color = "#ff6b6b"; errLine.style.marginTop = "8px"; errLine.style.fontSize = "13px";
      errLine.textContent = "Gagal: " + (e && e.message ? e.message : String(e));
      card.appendChild(errLine);
    }
  });
  cancelBtn.addEventListener("click", function () {
    title.textContent += " — Dibatalkan";
    btnRow.remove();
  });

  btnRow.appendChild(okBtn); btnRow.appendChild(cancelBtn);
  card.appendChild(btnRow);
  row.appendChild(avatar); row.appendChild(card);
  wrap.appendChild(row);
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
}

// Data import Outbound disimpen di Firebase dalam bentuk COLUMNAR + GZIP base64 (biar hemat kuota,
// SAMA PERSIS teknik yang dipakai outbound.html sendiri) — jadi harus di-decode balik di sini dulu
// sebelum dipakai buat jawab pertanyaan.
function outboundBase64ToUint8(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
async function outboundDecompressFromBase64(base64){
  const bytes = outboundBase64ToUint8(base64);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
function outboundFromColumnar(columnar){
  if (!columnar || !columnar.fields || !columnar.length) return [];
  const fields = columnar.fields, length = columnar.length, columns = columnar.columns;
  const rows = new Array(length);
  for (let i = 0; i < length; i++){
    const row = {};
    for (let f = 0; f < fields.length; f++) row[fields[f]] = columns[fields[f]][i];
    rows[i] = row;
  }
  return rows;
}

function fetchOutboundData(){
  return new Promise((resolve, reject) => {
    if (!window.firebase || !firebase.apps || !firebase.apps.length){
      reject(new Error("Firebase belum ke-init (auth-guard.js gak ketemu / belum login)"));
      return;
    }
    if (!firebase.auth().currentUser){
      reject(new Error("Belum login — buka file ini lewat app shell / login dulu"));
      return;
    }
    const db = firebase.database();
    Promise.all([
      db.ref(FB_OUTBOUND_ROOT + "/latestImportMeta").once("value"),
      db.ref(FB_OUTBOUND_ROOT + "/latestImportData").once("value")
    ]).then(function (snaps) {
      const meta = snaps[0].val() || null;
      const payload = snaps[1].val();
      if (!payload || !payload.dataGz){ resolve({ rows: [], meta: meta }); return; }
      outboundDecompressFromBase64(payload.dataGz).then(function (jsonStr) {
        let columnar;
        try { columnar = JSON.parse(jsonStr); } catch (e) { reject(e); return; }
        const rows = outboundFromColumnar(columnar).map(function (row) {
          return Object.assign({}, row, {
            completeDateObj: row.completeDateObj ? new Date(row.completeDateObj) : null
          });
        });
        resolve({ rows: rows, meta: meta });
      }).catch(reject);
    }).catch(reject);
  });
}

function outboundShiftFromTimeStr(timeStr){
  if (!timeStr || timeStr === "-") return "Shift 1";
  const parts = timeStr.split(":");
  const totalMinutes = (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
  const GRACE = 40; // SAMA PERSIS grace period pergantian shift di outbound.html
  if (totalMinutes >= GRACE && totalMinutes < (8 * 60) + GRACE) return "Shift 1";
  if (totalMinutes >= (8 * 60) + GRACE && totalMinutes < (16 * 60) + GRACE) return "Shift 2";
  return "Shift 3";
}
const outboundLinehaulRoutes = Array.from(new Set(outboundLinehaulSchedule.map(function (s) { return s.dest; })))
  .map(function (label, idx) {
    const hubs = Array.from(new Set(outboundLinehaulSchedule.filter(function (s) { return s.dest === label; }).flatMap(function (s) { return s.hubs; })));
    return { id: idx + 1, label: label, hubs: hubs };
  });
function outboundTimeStrToMinutes(timeStr){
  const parts = String(timeStr || "0:0").split(":");
  return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
}
const outboundHubDepartureMinutesMap = {};
outboundLinehaulSchedule.forEach(function (s) {
  const mins = outboundTimeStrToMinutes(s.time);
  s.hubs.forEach(function (h) {
    if (!outboundHubDepartureMinutesMap[h]) outboundHubDepartureMinutesMap[h] = [];
    outboundHubDepartureMinutesMap[h].push(mins);
  });
});
Object.keys(outboundHubDepartureMinutesMap).forEach(function (h) { outboundHubDepartureMinutesMap[h].sort(function (a, b) { return a - b; }); });

// SAMA PERSIS logic getDeliveryShiftForItem() di outbound.html — shift sebuah parcel ditentukan dari
// keberangkatan hub terdekat SESUDAH jam packing, bukan cuma dibagi rata jam packing / 8 jam.
function outboundDeliveryShiftForItem(item){
  if (!item.completeDateObj) return item.shift;
  const packMinutes = item.completeDateObj.getHours() * 60 + item.completeDateObj.getMinutes();
  const times = outboundHubDepartureMinutesMap[item.receiverName];
  if (!times || times.length === 0) return item.shift;
  let nextMinutes = times.find(function (t) { return t >= packMinutes; });
  if (nextMinutes === undefined) nextMinutes = times[0];
  const hh = String(Math.floor(nextMinutes / 60)).padStart(2, "0");
  const mm = String(nextMinutes % 60).padStart(2, "0");
  return outboundShiftFromTimeStr(hh + ":" + mm);
}
// SAMA PERSIS logic getDepartureStatus() di outbound.html
function outboundDepartureStatusText(timeStr){
  const now = new Date();
  const parts = timeStr.split(":");
  const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(parts[0], 10), parseInt(parts[1], 10) || 0);
  const diffMinutes = (target - now) / 60000;
  if (diffMinutes < 0) return "Lewat Jadwal";
  if (diffMinutes <= 30) return "Segera (kurang dari 30 menit)";
  return "Terjadwal";
}
// SAMA PERSIS logic getRouteAlert() di outbound.html
function outboundRouteAlert(pct){
  if (pct > 150) return { level: "CRITICAL", text: "Need Early Load + Slot Tambahan (Follow Up Team MM)" };
  if (pct > 100) return { level: "URGENT", text: "Need Early Loading Segera (Follow Up Team MM)" };
  if (pct > 50) return { level: "WATCH", text: "Need Early Loading (Follow Up Team MM)" };
  return { level: "AMAN", text: "Kondisi Normal, Belum Perlu Tindakan" };
}

// Bikin RINGKASAN AGREGAT modul Outbound (Aging & Packer Backlog + Occupancy & Shift) dari data
// mentah per-parcel — REPLIKASI PERSIS logic hitung di outbound.html (renderDashboard(),
// renderPackerLeaderboard(), renderShiftTable(), renderExecutiveSummary(), dst), biar angka yang
// Odyssey sebut ke user SAMA PERSIS kayak yang keliatan di dashboard Outbound. Sengaja GAK ngirim
// ribuan baris parcel mentah ke AI (boros token & lambat) — cukup ringkasan agregatnya aja, yang
// notabene udah mencakup semua sudut pandang (per rute, per packer, per shift, per destinasi).
function buildOutboundSummary(rawData){
  const cfg = outboundGetSettings();
  const total = rawData.length;
  const parcelCount = rawData.filter(function (d) { return d.packingMethod === "Assisted Sorting"; }).length;
  const bulkyCount = rawData.filter(function (d) { return d.packingMethod === "Individual Packing"; }).length;
  const hvCount = rawData.filter(function (d) { return d.isHv; }).length;
  const liquidCount = rawData.filter(function (d) { return d.isLiquid; }).length;
  const criticalParcels = rawData.filter(function (d) { return d.agingDays > 4; }).length;
  const capPctRaw = cfg.maxStagingCapacity > 0 ? (total / cfg.maxStagingCapacity) * 100 : 0;
  const criticalPctOfTotal = total > 0 ? (criticalParcels / total) * 100 : 0;

  // Breakdown Volume & Aging Days Inner Island (per rute linehaul terjadwal)
  const routeVolumes = outboundLinehaulRoutes.map(function (r) {
    return { label: r.label, total: 0, parcel: 0, bulky: 0, d0: 0, d1: 0, d2: 0, d3: 0, d4: 0, d5: 0, d6: 0, dMore: 0 };
  });
  const outerIslandMap = {};
  rawData.forEach(function (item) {
    const isParcel = item.packingMethod === "Assisted Sorting";
    const isBulky = item.packingMethod === "Individual Packing";
    let matched = false;
    for (let i = 0; i < outboundLinehaulRoutes.length; i++){
      if (outboundLinehaulRoutes[i].hubs.includes(item.receiverName)){
        const r = routeVolumes[i];
        r.total++;
        if (isParcel) r.parcel++;
        if (isBulky) r.bulky++;
        if (item.agingDays === 0) r.d0++;
        else if (item.agingDays === 1) r.d1++;
        else if (item.agingDays === 2) r.d2++;
        else if (item.agingDays === 3) r.d3++;
        else if (item.agingDays === 4) r.d4++;
        else if (item.agingDays === 5) r.d5++;
        else if (item.agingDays === 6) r.d6++;
        else if (item.agingDays > 6) r.dMore++;
        matched = true;
        break;
      }
    }
    if (!matched){
      if (!outerIslandMap[item.receiverName]) outerIslandMap[item.receiverName] = { name: item.receiverName, total: 0, parcel: 0 };
      outerIslandMap[item.receiverName].total++;
      outerIslandMap[item.receiverName].parcel++;
    }
  });
  // Cap (%) Inner Island pakai kapasitas tetap 4000/rute (SAMA PERSIS outbound.html)
  routeVolumes.forEach(function (r) { r.capPct = Number(((r.total / 4000) * 100).toFixed(1)); });
  routeVolumes.sort(function (a, b) { return b.total - a.total; });
  // Cap (%) Outer Island pakai DESTINATION_CAPACITY per destinasi (setting System Settings)
  const outerIslandList = Object.values(outerIslandMap).map(function (r) {
    return Object.assign({}, r, { capPct: Number((cfg.destCapacity > 0 ? (r.total / cfg.destCapacity) * 100 : 0).toFixed(1)) });
  }).sort(function (a, b) { return b.total - a.total; });

  // Priority Action Center — Top 5 Rute Occupancy Tertinggi (gabungan Inner + Outer)
  const top5Priority = routeVolumes.map(function (r) { return { label: r.label, total: r.total, pct: (r.total / 4000) * 100, category: "Inner" }; })
    .concat(outerIslandList.map(function (r) { return { label: r.name, total: r.total, pct: (r.total / 2000) * 100, category: "Outer" }; }))
    .sort(function (a, b) { return b.pct - a.pct; }).slice(0, 5)
    .map(function (r) {
      const alert = outboundRouteAlert(r.pct);
      return { rute: r.label, kategori: r.category, totalParcel: r.total, persenOccupancy: Number(r.pct.toFixed(1)), levelAlert: alert.level, rekomendasiAksi: alert.text };
    });

  // Packer Leaderboard (Root Cause backlog kritis per operator)
  const packerMap = {};
  rawData.forEach(function (item) {
    const p = item.lastPacker && item.lastPacker !== "-" ? item.lastPacker : "Unassigned / Unknown";
    if (!packerMap[p]) packerMap[p] = { name: p, total: 0, d0: 0, d1: 0, d2: 0, d3: 0, d4: 0, d5: 0, d6: 0, criticalD6: 0 };
    packerMap[p].total++;
    if (item.agingDays === 0) packerMap[p].d0++;
    else if (item.agingDays === 1) packerMap[p].d1++;
    else if (item.agingDays === 2) packerMap[p].d2++;
    else if (item.agingDays === 3) packerMap[p].d3++;
    else if (item.agingDays === 4) packerMap[p].d4++;
    else if (item.agingDays === 5) packerMap[p].d5++;
    else if (item.agingDays === 6) packerMap[p].d6++;
    if (item.agingDays > 4) packerMap[p].criticalD6++;
  });
  const totalCriticalAll = Object.values(packerMap).reduce(function (s, p) { return s + p.criticalD6; }, 0);
  const packerLeaderboard = Object.values(packerMap).map(function (p) {
    return Object.assign({}, p, { kontribusiBacklogKritisPct: totalCriticalAll > 0 ? Number(((p.criticalD6 / totalCriticalAll) * 100).toFixed(1)) : 0 });
  }).sort(function (a, b) { return b.total - a.total; }).slice(0, 30); // batasin Top 30 biar payload gak membengkak

  // Perbandingan Volume Parcel per Shift (pakai jadwal keberangkatan hub, bukan cuma jam packing)
  let s1 = 0, s2 = 0, s3 = 0;
  rawData.forEach(function (d) {
    const sh = outboundDeliveryShiftForItem(d);
    if (sh === "Shift 1") s1++; else if (sh === "Shift 2") s2++; else s3++;
  });

  // Shift Departure Schedule & Heatmap Monitoring (jadwal + status real-time SEKARANG)
  const shiftSchedule = outboundLinehaulSchedule.map(function (s) {
    return { rute: s.dest, slot: s.slot, jamKeberangkatan: s.time, shift: outboundShiftFromTimeStr(s.time), statusSekarang: outboundDepartureStatusText(s.time) };
  }).sort(function (a, b) { return a.jamKeberangkatan.localeCompare(b.jamKeberangkatan); });

  // Verdict keseluruhan DC — SAMA PERSIS logic renderExecutiveSummary() di outbound.html
  const worst = top5Priority.length > 0 ? top5Priority[0] : null;
  const routeCritical = worst && (worst.levelAlert === "CRITICAL" || worst.levelAlert === "URGENT");
  const routeWatch = worst && worst.levelAlert === "WATCH";
  let verdict = "AMAN";
  if (capPctRaw >= 100 || routeCritical || criticalPctOfTotal > cfg.slaAgingTarget * 2) verdict = "KRITIS";
  else if (capPctRaw >= cfg.slaOccTarget || criticalPctOfTotal > cfg.slaAgingTarget || routeWatch) verdict = "WASPADA";

  return {
    infoImportTerakhir: currentOutboundMeta,
    ringkasanEksekutif: {
      totalParcelDiStagingArea: total,
      breakdownTipePacking: { parcel_AssistedSorting: parcelCount, bulky_IndividualPacking: bulkyCount, highValue: hvCount, liquid: liquidCount },
      backlogKritis_AgingLebihDari4Hari: criticalParcels,
      persenBacklogKritisDariTotal: Number(criticalPctOfTotal.toFixed(1)),
      kapasitasMaxStagingDC: cfg.maxStagingCapacity,
      persenOkupansiStagingDC: Number(capPctRaw.toFixed(1)),
      slaTargetOkupansiMaxPct: cfg.slaOccTarget,
      slaTargetBacklogKritisMaxPct: cfg.slaAgingTarget,
      verdictKondisiDC: verdict
    },
    volumeParcelPerShift: { "Shift 1 (00:00-09:00)": s1, "Shift 2 (08:00-17:00)": s2, "Shift 3 (16:00-01:00)": s3 },
    breakdownVolumeAgingInnerIsland: routeVolumes,
    breakdownVolumeOuterIsland: outerIslandList,
    priorityActionCenter_Top5RuteOccupancyTertinggi: top5Priority,
    packerLeaderboard_RootCauseBacklogKritis_Top30: packerLeaderboard,
    shiftDepartureScheduleHeatmap: shiftSchedule
  };
}

function pbPad2(n){ return String(n).padStart(2, "0"); }

// "Kemarin" versi tanggal lokal device (SAMA PERSIS getYesterdayDateStr() di performance-bagger.html) —
// dipakai buat kolom "D+1 Packed (Quick View D+1)".
function pbYesterdayLocal(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + "-" + pbPad2(d.getMonth() + 1) + "-" + pbPad2(d.getDate());
}

// Range & label bulan berjalan (SAMA PERSIS currentMonthRange() di performance-bagger.html, tanpa
// parameter monthStr karena Odyssey selalu ambil bulan berjalan device SEKARANG).
function pbCurrentMonthRangeLocal(){
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const bulanIndo = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return {
    start: y + "-" + pbPad2(m) + "-01",
    end: y + "-" + pbPad2(m) + "-31",
    label: bulanIndo[m - 1] + " " + y
  };
}

// Ambil data LIVE dari Firebase root "prDcPerformanceBagger" — SAMA PERSIS sumber yang dipakai
// dashboard performance-bagger.html (bulan berjalan buat dailyRecords, + 20 log import terakhir).
// Data ini tersimpan sebagai JSON polos (BUKAN gzip/columnar kayak modul Outbound), jadi gak perlu
// decompress, cukup baca langsung.
function fetchPerformanceBaggerData(){
  return new Promise((resolve, reject) => {
    if (!window.firebase || !firebase.apps || !firebase.apps.length){
      reject(new Error("Firebase belum ke-init (auth-guard.js gak ketemu / belum login)"));
      return;
    }
    if (!firebase.auth().currentUser){
      reject(new Error("Belum login — buka file ini lewat app shell / login dulu"));
      return;
    }
    const db = firebase.database();
    const range = pbCurrentMonthRangeLocal();
    Promise.all([
      db.ref(FB_PB_ROOT + "/dailyRecords").orderByKey().startAt(range.start).endAt(range.end).once("value"),
      db.ref(FB_PB_ROOT + "/importLogs").once("value")
    ]).then(function (snaps) {
      const dailyRecords = snaps[0].val() || {};
      const logsVal = snaps[1].val() || {};
      const importLogs = Object.keys(logsVal).map(function (k) { return logsVal[k]; })
        .sort(function (a, b) { return new Date(b.importedAt) - new Date(a.importedAt); })
        .slice(0, 20);
      resolve({ dailyRecords: dailyRecords, importLogs: importLogs });
    }).catch(reject);
  });
}

// Hitung agregat per operator — REPLIKASI PERSIS logic computePbAggregates() di performance-bagger.html
// (total packed, rata-rata/hari, achievedDays vs target, d1Packed "kemarin", underStreak/overStreak
// beruntun di bawah/atas target [ngabaikan hari Off Duty/Cuti/Sakit/Izin], growth 3 hari terakhir vs
// 3 hari sebelumnya, badge Speed Demon/Most Consistent/On Fire) — supaya angka yang dijawab Odyssey
// PERSIS sama kayak yang ditampilin di tabel dashboard Performance Bagger, bukan ngitung versi sendiri.
function computePbAggregatesForAgent(dailyRecords){
  const agg = {};
  const targetDateStr = pbYesterdayLocal();

  PB_STAFF_ROSTER.forEach(function (s) {
    agg[s.opsId] = { name: s.name, opsId: s.opsId, agency: s.agency, status: s.status, total: 0, days: 0, achievedDays: 0, d1Packed: 0, dailyData: {}, dailyStatus: {} };
  });

  Object.keys(dailyRecords).forEach(function (dateStr) {
    const dayData = dailyRecords[dateStr] || {};
    Object.keys(dayData).forEach(function (opsId) {
      const rec = dayData[opsId];
      if (!agg[opsId]) {
        agg[opsId] = { name: rec.name || opsId, opsId: opsId, agency: rec.agency || "-", status: "DW On Call", total: 0, days: 0, achievedDays: 0, d1Packed: 0, dailyData: {}, dailyStatus: {} };
      }
      const packed = rec.packed || 0;
      agg[opsId].total += packed;
      agg[opsId].days += 1;
      agg[opsId].dailyData[dateStr] = packed;
      agg[opsId].dailyStatus[dateStr] = rec.statusInfo || "Normal / Bekerja";
      if (dateStr === targetDateStr) agg[opsId].d1Packed = packed;
      const threshold = PB_ACHIEVEMENT_THRESHOLD[agg[opsId].status] || PB_ACHIEVEMENT_THRESHOLD["DW On Call"];
      if (packed >= threshold) agg[opsId].achievedDays += 1;
    });
  });

  let maxAvg = 0;
  let topSpeedOpsId = null;

  Object.keys(agg).forEach(function (opsId) {
    const item = agg[opsId];
    item.avg = item.days > 0 ? Math.round(item.total / item.days) : 0;
    if (item.days > 0 && item.avg > maxAvg) { maxAvg = item.avg; topSpeedOpsId = opsId; }

    const dates = Object.keys(item.dailyData).sort();
    const threshold = PB_ACHIEVEMENT_THRESHOLD[item.status] || PB_ACHIEVEMENT_THRESHOLD["DW On Call"];

    let underStreak = 0;
    for (let i = dates.length - 1; i >= 0; i--) {
      const dStr = dates[i];
      const stInfo = item.dailyStatus[dStr];
      const isOffDutyOrLeave = stInfo && stInfo !== "Normal / Bekerja";
      if (item.dailyData[dStr] < threshold) { if (!isOffDutyOrLeave) underStreak++; }
      else break;
    }
    item.underStreak = underStreak;

    let overStreak = 0;
    for (let i = dates.length - 1; i >= 0; i--) {
      if (item.dailyData[dates[i]] >= threshold) overStreak++; else break;
    }
    item.overStreak = overStreak;

    if (dates.length >= 4) {
      const recent = dates.slice(-3).reduce(function (acc, d) { return acc + item.dailyData[d]; }, 0) / 3;
      const prevSlice = dates.slice(-6, -3);
      const prev = prevSlice.reduce(function (acc, d) { return acc + item.dailyData[d]; }, 0) / (dates.length >= 6 ? 3 : (dates.length - 3));
      item.growth = prev > 0 ? Math.round(((recent - prev) / prev) * 100) : 0;
    } else {
      item.growth = 0;
    }

    const achRate = item.days > 0 ? (item.achievedDays / item.days) : null;
    item.achievementRatePct = achRate !== null ? Number((achRate * 100).toFixed(1)) : null;
    item.isRedFlag = item.days > 0 && ((achRate !== null && achRate < 0.5) || item.underStreak >= 3);
    item.badgeMostConsistent = item.days >= 3 && item.achievedDays === item.days;
    item.badgeOnFire = item.overStreak >= 3;
    item.badgeSpeedDemon = false;
  });

  if (topSpeedOpsId) agg[topSpeedOpsId].badgeSpeedDemon = true;
  return agg;
}

// Ringkasan lengkap modul Performance Bagger buat dikirim ke AI — mencakup semua sudut pandang yang
// ada di dashboard (Hall of Fame Top 3, ringkasan achievement rate keseluruhan, breakdown per agency,
// daftar Red Flag/Needs Coaching, ranking lengkap SEMUA operator di roster + badge & streak-nya, dan
// riwayat import PDVT terakhir).
function buildPerformanceBaggerSummary(dailyRecords, importLogs){
  const range = pbCurrentMonthRangeLocal();
  const agg = computePbAggregatesForAgent(dailyRecords);
  const rows = Object.keys(agg).map(function (opsId) { return agg[opsId]; });
  const withData = rows.filter(function (r) { return r.days > 0; });

  let totalDaysAll = 0, totalAchievedAll = 0;
  withData.forEach(function (r) { totalDaysAll += r.days; totalAchievedAll += r.achievedDays; });
  const overallRate = totalDaysAll > 0 ? Number(((totalAchievedAll / totalDaysAll) * 100).toFixed(1)) : 0;

  const topPerformer = withData.length ? withData.slice().sort(function (a, b) { return b.total - a.total; })[0] : null;
  const hallOfFameTop3 = withData.slice().sort(function (a, b) { return b.total - a.total; }).slice(0, 3)
    .map(function (r) { return { nama: r.name, opsId: r.opsId, agency: r.agency, totalPackedBulanIni: r.total }; });

  const redFlagList = rows.filter(function (r) { return r.isRedFlag; })
    .map(function (r) { return { nama: r.name, opsId: r.opsId, agency: r.agency, statusKepegawaian: r.status, achievementRatePct: r.achievementRatePct, hariBeruntunDiBawahTarget: r.underStreak }; });

  const agencyMap = {};
  rows.forEach(function (r) {
    if (!agencyMap[r.agency]) agencyMap[r.agency] = { agency: r.agency, totalPackedBulanIni: 0, jumlahOperatorSudahAdaData: 0 };
    agencyMap[r.agency].totalPackedBulanIni += r.total;
    if (r.days > 0) agencyMap[r.agency].jumlahOperatorSudahAdaData += 1;
  });

  const rankingLengkap = rows.slice().sort(function (a, b) { return b.total - a.total; }).map(function (r, idx) {
    const badges = [];
    if (r.badgeSpeedDemon) badges.push("Speed Demon (rata-rata/hari tertinggi se-DC)");
    if (r.badgeMostConsistent) badges.push("Most Consistent (100% achievement, min. 3 hari data)");
    if (r.badgeOnFire) badges.push("On Fire (≥3 hari beruntun di atas target)");
    if (r.isRedFlag) badges.push("Red Flag / Needs Coaching");
    return {
      rankTotalBulanIni: idx + 1,
      nama: r.name, opsId: r.opsId, agency: r.agency, statusKepegawaian: r.status,
      targetHarian: PB_ACHIEVEMENT_THRESHOLD[r.status] || PB_ACHIEVEMENT_THRESHOLD["DW On Call"],
      totalPackedBulanIni: r.total, rataRataPackedPerHari: r.avg,
      jumlahHariAdaData: r.days, jumlahHariTercapaiTarget: r.achievedDays,
      achievementRatePct: r.achievementRatePct,
      packedKemarin_QuickViewD1: r.d1Packed,
      hariBeruntunDiBawahTarget: r.underStreak, hariBeruntunDiAtasTarget: r.overStreak,
      growthPct_3HariTerakhirVs3HariSebelumnya: r.growth,
      badges: badges
    };
  });

  return {
    catatanPentingBuatAI: "Data ini SAMA PERSIS sumber & cara hitung yang dipakai dashboard Performance Bagger " +
      "(modul monitoring produktivitas packer/bagger harian, sumber import file PDVT harian/mingguan) — " +
      "JANGAN hitung ulang pakai cara/asumsi sendiri, cukup baca & olah dari dump JSON ini.",
    bulanBerjalan: range.label,
    tanggalReferensiKemarin_UntukD1: pbYesterdayLocal(),
    targetAchievementPerStatusKepegawaian: PB_ACHIEVEMENT_THRESHOLD,
    ringkasan: {
      totalOperatorDiRoster: rows.length,
      operatorYangSudahAdaDataBulanIni: withData.length,
      achievementRateKeseluruhanPct: overallRate,
      totalHariDataTercapaiTargetSeDC: totalAchievedAll,
      totalHariDataKeseluruhanSeDC: totalDaysAll,
      topPerformerBulanIni: topPerformer ? { nama: topPerformer.name, opsId: topPerformer.opsId, agency: topPerformer.agency, totalPackedBulanIni: topPerformer.total } : null
    },
    hallOfFameTop3BulanIni: hallOfFameTop3,
    agencyBreakdown: Object.values(agencyMap).sort(function (a, b) { return b.totalPackedBulanIni - a.totalPackedBulanIni; }),
    daftarRedFlag_NeedsCoaching: redFlagList,
    rankingLengkapSemuaOperatorDiRoster: rankingLengkap,
    riwayatImportPdvtTerakhir: (importLogs || []).slice(0, 10).map(function (l) {
      return { namaFile: l.fileName, tanggalCakupan: l.tanggal, jumlahOperator: l.rowCount, importedBy: l.importedBy, importedAt: l.importedAt };
    })
  };
}

// Ringkasan lengkap modul Inventory Control buat dikirim ke AI — gabungan data MENTAH (Stock, Asset
// IT & NCA, Audit Log terbaru) SUPAYA Odyssey bisa jawab pertanyaan detail apa aja, PLUS bagian
// "sudahDihitungFinal" yang angkanya udah dihitung persis sama kayak dashboard (Low Stock + estimasi
// habis & saran reorder, KPI Highlight Usage hari ini/bulan ini/delta vs bulan lalu, Top Asset
// Terpakai bulan ini, breakdown pemakaian per Devisi SOC vs EHA) — biar AI GAK ngitung ulang pakai
// cara/asumsi sendiri buat angka-angka yang emang udah final di dashboard.
function buildInventoryControlSummary(stock, usageLogsRaw, assetItNca, auditLogRaw){
  const today = invTodayStrLocal();
  const monthPrefix = today.slice(0, 7);
  const now = new Date();
  const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const lastMonthPrefix = lastMonthDate.getFullYear() + "-" + String(lastMonthDate.getMonth() + 1).padStart(2, "0");

  const usageLogsArr = Object.keys(usageLogsRaw).map(function (id) { return Object.assign({ logId: id }, usageLogsRaw[id]); });

  let todayTotal = 0, monthTotal = 0, lastMonthTotal = 0;
  const monthAssetTotals = {};
  const monthDevisiTotals = { SOC: 0, EHA: 0 };
  usageLogsArr.forEach(function (log) {
    const d = log.workingDate || "";
    const q = Number(log.qtyUsed) || 0;
    if (d === today) todayTotal += q;
    if (d.slice(0, 7) === monthPrefix) {
      monthTotal += q;
      monthAssetTotals[log.assetName || "-"] = (monthAssetTotals[log.assetName || "-"] || 0) + q;
      const devisi = log.devisi || invGetDevisiForEmail(log.createdBy);
      monthDevisiTotals[devisi] = (monthDevisiTotals[devisi] || 0) + q;
    }
    if (d.slice(0, 7) === lastMonthPrefix) lastMonthTotal += q;
  });

  let monthDeltaPct = null; // null = gak ada perbandingan (dua-duanya 0)
  let monthDeltaKeterangan = "Belum ada data bulan ini maupun bulan lalu";
  if (!(lastMonthTotal === 0 && monthTotal === 0)) {
    if (lastMonthTotal === 0) {
      monthDeltaKeterangan = "Baru mulai bulan ini (bulan lalu 0)";
    } else {
      monthDeltaPct = Math.round(((monthTotal - lastMonthTotal) / lastMonthTotal) * 100);
      monthDeltaKeterangan = (monthDeltaPct >= 0 ? "naik " : "turun ") + Math.abs(monthDeltaPct) + "% dari bulan lalu";
    }
  }

  const topAssetBulanIni = Object.keys(monthAssetTotals).sort(function (a, b) { return monthAssetTotals[b] - monthAssetTotals[a]; })
    .map(function (name, idx) { return { rank: idx + 1, nama: name, totalTerpakaiBulanIni: monthAssetTotals[name] }; });

  // Rata-rata pemakaian/hari per Asset, 30 hari terakhir (buat estimasi habis stock) — SAMA PERSIS
  // logic renderUsageHighlight() di dashboard.
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 29);
  const cutoffStr = cutoff.getFullYear() + "-" + String(cutoff.getMonth() + 1).padStart(2, "0") + "-" + String(cutoff.getDate()).padStart(2, "0");
  const last30Totals = {};
  usageLogsArr.forEach(function (log) {
    const d = log.workingDate || "";
    if (d >= cutoffStr && log.assetId) last30Totals[log.assetId] = (last30Totals[log.assetId] || 0) + (Number(log.qtyUsed) || 0);
  });
  const avgPerDayByAsset = {};
  Object.keys(last30Totals).forEach(function (id) { avgPerDayByAsset[id] = last30Totals[id] / 30; });

  const stockArr = Object.keys(stock).map(function (id) { return Object.assign({ assetId: id }, stock[id]); });
  const lowStockDetail = [];
  stockArr.forEach(function (a) {
    const minStock = Number(a.minStock) || 0;
    const qty = Number(a.qty) || 0;
    if (minStock > 0 && qty <= minStock) {
      const avgPerDay = avgPerDayByAsset[a.assetId] || 0;
      const daysRemaining = qty <= 0 ? 0 : (avgPerDay > 0 ? Math.floor(qty / avgPerDay) : null);
      const reorderQty = avgPerDay > 0 ? Math.max(0, Math.ceil((avgPerDay * 30) - qty)) : Math.max(0, minStock - qty);
      lowStockDetail.push({
        nama: a.name || "-", unit: a.unit || "-", qtySekarang: qty, minStock: minStock,
        rataRataPemakaianPerHari_30HariTerakhir: Number(avgPerDay.toFixed(2)),
        estimasiHabisDalamHari: daysRemaining,
        saranReorderQty: reorderQty
      });
    }
  });
  lowStockDetail.sort(function (a, b) {
    const av = a.estimasiHabisDalamHari === null ? Infinity : a.estimasiHabisDalamHari;
    const bv = b.estimasiHabisDalamHari === null ? Infinity : b.estimasiHabisDalamHari;
    return av - bv;
  });

  const stockLengkap = stockArr.map(function (a) {
    const minStock = Number(a.minStock) || 0;
    const qty = Number(a.qty) || 0;
    return {
      // "assetId" ini KEY ASLI di Firebase (bukan hasil generate/tebakan) — WAJIB dipakai apa adanya
      // kalau nyiapin "inventoryAction" (Update Stock/Usage Log), JANGAN pernah dimodif/disingkat/ditebak.
      assetId: a.assetId,
      nama: a.name || "-", kategori: a.category || "-", unit: a.unit || "-",
      qty: qty, minStock: minStock, statusStock: (minStock > 0 && qty <= minStock) ? "Menipis" : "Aman",
      catatan: a.note || "-", terakhirDiupdate: a.updatedAt ? new Date(a.updatedAt).toISOString() : null,
      diupdateOleh: a.updatedBy || "-"
    };
  }).sort(function (a, b) { return a.nama.localeCompare(b.nama); });

  const assetItNcaLengkap = Object.keys(assetItNca).map(function (id) {
    const a = assetItNca[id];
    return {
      nama: a.name || "-", jenis: a.jenis || "IT", jumlah: Number(a.qty) || 1,
      noSerialInventaris: a.serial || "-", picPemegang: a.pic || "-", lokasi: a.lokasi || "-",
      status: a.status || "Aktif", catatan: a.note || "-",
      terakhirDiupdate: a.updatedAt ? new Date(a.updatedAt).toISOString() : null, diupdateOleh: a.updatedBy || "-"
    };
  }).sort(function (a, b) { return a.nama.localeCompare(b.nama); });

  const auditLogTerbaru = Object.keys(auditLogRaw).map(function (id) { return auditLogRaw[id]; })
    .sort(function (a, b) { return (b.changedAt || 0) - (a.changedAt || 0); })
    .slice(0, 100)
    .map(function (r) {
      return { waktu: r.changedAt ? new Date(r.changedAt).toISOString() : null, modul: r.module || "-", aksi: r.action || "-", namaItem: r.itemName || "-", detail: r.detail || "-", diubahOleh: r.changedBy || "-" };
    });

  return {
    catatanPentingBuatAI: "Modul Inventory Control ini punya 5 sub-menu: (1) Log Activity Usage — input " +
      "pemakaian asset harian per Devisi, (2) Highlight Usage — dashboard KPI & leaderboard pemakaian, " +
      "(3) Stock — database jumlah stock consumable & Min Stock, (4) Asset IT & NCA — database aset non-consumable " +
      "(laptop, meja, dst) per unit dengan PIC/lokasi/status, (5) Audit Log — riwayat semua perubahan. Devisi SOC " +
      "(Sortation Center) & EHA (Exception Handling Area) itu SATU dashboard gabungan, pembedanya cuma field " +
      "\"devisi\" di tiap Log Usage (otomatis dari email yang input) — BUKAN dua modul terpisah. Bagian " +
      "\"sudahDihitungFinal\" di bawah angkanya SUDAH final dihitung persis sama kayak dashboard — JANGAN hitung " +
      "ulang pakai cara/asumsi sendiri, cukup baca & olah dari situ. Bagian lain (stockLengkap, assetItNcaLengkap, " +
      "auditLogTerbaru) itu data MENTAH lengkap buat kamu olah sendiri kalau user nanya detail spesifik.",
    tanggalHariIni: today,
    devisiInfo: INV_DEVISI_LABELS,
    sudahDihitungFinal: {
      highlightUsageKpi: {
        totalTerpakaiHariIni: todayTotal,
        totalTerpakaiBulanIni: monthTotal,
        totalTerpakaiBulanLalu: lastMonthTotal,
        deltaBulanIniVsBulanLaluPct: monthDeltaPct,
        deltaKeterangan: monthDeltaKeterangan,
        jumlahAssetTersentuhBulanIni: Object.keys(monthAssetTotals).length,
        jumlahAssetStockMenipis: lowStockDetail.length
      },
      breakdownPemakaianBulanIniPerDevisi: {
        SOC_SortationCenter: monthDevisiTotals.SOC || 0,
        EHA_ExceptionHandlingArea: monthDevisiTotals.EHA || 0
      },
      topAssetTerpakaiBulanIni: topAssetBulanIni,
      lowStockDetailDenganEstimasiHabisDanSaranReorder: lowStockDetail
    },
    stockLengkap: stockLengkap,
    assetItNcaLengkap: assetItNcaLengkap,
    auditLogTerbaru_Max100: auditLogTerbaru
  };
}

// ================= INVENTORY CONTROL - AKSI TULIS (Update Stock & Submit Usage Log) =================
// PENTING soal Firebase Rules: kita SENGAJA gak pernah overwrite whole node "stock/{id}" (itu butuh
// whitelist admin di rules). Update qty pakai .transaction() cuma di path "stock/{id}/qty" +
// .update() cuma di "updatedAt"/"updatedBy" — dua-duanya nested rule-nya cuma butuh auth != null &
// bukan email yang di-banned (securty-swat / mmpalangkarayadc), SAMA PERSIS pola proceedSubmitUsageLog()
// di inventory-control.html. Ini bikin fitur ini jalan buat SEMUA user yang emang udah punya akses ke
// modul Inventory Control, gak perlu whitelist tambahan.
function invLogAudit(module, action, itemName, detail){
  const db = firebase.database();
  const facilityRoot = FB_INV_ROOT + "/" + INV_FACILITY;
  const payload = {
    module: module, action: action, itemName: itemName, detail: detail || "",
    changedAt: Date.now(), changedBy: (firebase.auth().currentUser && firebase.auth().currentUser.email) || "-"
  };
  return db.ref(facilityRoot + "/auditLog").push().set(payload).catch(function (e) { console.error("invLogAudit gagal:", e); });
}

// Update Stock: nambah/ngurangin qty asset yang UDAH ADA di Stock. delta boleh positif (restock) atau
// negatif (koreksi manual) — beda dari Usage Log yang otomatis ngurangin qty + nyatet history pemakaian.
async function invUpdateStockQty(assetId, delta, assetNameFallback){
  // Pengaman WAJIB: jangan pernah percaya assetId dari AI mentah-mentah. Kalau ID ini gak beneran ada
  // di Stock saat ini, Firebase .transaction() bakal bikin NODE BARU kosong (cuma field qty doang) —
  // itu row sampah, bukan koreksi ke item yang dimaksud. Makanya divalidasi dulu di sini SEBELUM nulis.
  if (!currentInvStock[assetId]){
    throw new Error("Asset ID \"" + assetId + "\" gak ketemu di Stock saat ini — kemungkinan AI salah tangkep/nebak ID, dibatalkan biar gak bikin data sampah. Coba sebutin ulang nama barangnya lebih spesifik.");
  }
  const db = firebase.database();
  const facilityRoot = FB_INV_ROOT + "/" + INV_FACILITY;
  const userEmail = (firebase.auth().currentUser && firebase.auth().currentUser.email) || "-";
  const txResult = await db.ref(facilityRoot + "/stock/" + assetId + "/qty").transaction(function (curQty) {
    return (Number(curQty) || 0) + delta;
  });
  if (!txResult.committed) throw new Error("Transaction update qty gagal / dibatalkan Firebase.");
  await db.ref(facilityRoot + "/stock/" + assetId).update({ updatedAt: Date.now(), updatedBy: userEmail });
  const newQty = txResult.snapshot.val();
  const assetName = (currentInvStock[assetId] && currentInvStock[assetId].name) || assetNameFallback || assetId;
  await invLogAudit("Stock", "update", assetName, (delta >= 0 ? "+" : "") + delta + " -> qty jadi " + newQty + " (via Odyssey)");
  return newQty;
}

// Submit Usage Log: bikin entry log baru + otomatis ngurangin qty stock terkait (transaction), niru
// persis proceedSubmitUsageLog() di inventory-control.html — SATU per SATU berurutan biar aman kalau ada
// yang gagal di tengah jalan.
async function invSubmitUsageLog(items, dateStr, devisi, stockSnapshot){
  const db = firebase.database();
  const facilityRoot = FB_INV_ROOT + "/" + INV_FACILITY;
  const userEmail = (firebase.auth().currentUser && firebase.auth().currentUser.email) || "-";
  const resolvedDevisi = devisi || invGetDevisiForEmail(userEmail);
  for (const item of items){
    const asset = stockSnapshot[item.assetId];
    if (!asset) throw new Error("Asset ID \"" + item.assetId + "\" gak ketemu di Stock (mungkin udah dihapus).");
    const logPayload = {
      assetId: item.assetId, assetName: asset.name || "-", unit: asset.unit || "-",
      qtyUsed: item.qty, workingDate: dateStr, devisi: resolvedDevisi,
      createdAt: Date.now(), createdBy: userEmail
    };
    const newKey = db.ref(facilityRoot + "/usageLogs").push().key;
    await db.ref(facilityRoot + "/usageLogs/" + newKey).set(logPayload);
    await db.ref(facilityRoot + "/stock/" + item.assetId + "/qty").transaction(function (curQty) {
      return (Number(curQty) || 0) - item.qty;
    });
    await db.ref(facilityRoot + "/stock/" + item.assetId).update({ updatedAt: Date.now(), updatedBy: userEmail });
  }
  const itemNames = items.map(function (it) { return (stockSnapshot[it.assetId].name || it.assetId) + " (" + it.qty + ")"; }).join(", ");
  await invLogAudit("Log Usage", "create", itemNames, "Tanggal: " + dateStr + ", Divisi: " + (INV_DEVISI_LABELS[resolvedDevisi] || resolvedDevisi) + " (via Odyssey)");
}

// ===== Replikasi persis logic status di inbound.html =====
function computeStatus(t){
  const atdOrigin = t.atdOrigin ? new Date(t.atdOrigin) : null;
  const ataDest = t.ataDest ? new Date(t.ataDest) : null;
  const now = new Date();
  let statusText = "-";
  let etaDateObj = atdOrigin ? new Date(atdOrigin.getTime() + 390*60*1000) : null; // ETA = atdOrigin + 6.5 jam

  if (atdOrigin){
    if (ataDest){
      const durationHours = (ataDest.getTime() - atdOrigin.getTime()) / 3600000;
      if (durationHours < 6.0) statusText = "Early Arrived";
      else if (durationHours <= 6.5) statusText = "On Time";
      else statusText = "Late Arrival";
    } else {
      statusText = (etaDateObj && now > etaDateObj) ? "Late Arrival" : "In Transit";
    }
  }
  return { statusText, etaDateObj };
}

// Format tanggal pakai KOMPONEN WAKTU LOKAL (WIB) — SAMA PERSIS kayak
// formatDateYYYYMMDD() di inbound.html. JANGAN pakai .toISOString().slice(0,10)
// buat ambil tanggal, karena toISOString() itu UTC: trip yang ATD Origin-nya
// jam 00:00-06:59 pagi WIB bakal "mundur" ke tanggal UTC sebelumnya (H-1),
// jadi gak match sama kolom "Tanggal" di dashboard Inbound yang pakai local time.
// Ini yang bikin AI Agent salah nyortir trip pas ditanya "hari ini".
function formatDateYYYYMMDDLocal(d){
  const pad = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}

function normalizeTrip(t){
  const { statusText, etaDateObj } = computeStatus(t);
  const dateSourceRaw = t.atdOrigin || t.stdOrigin;
  const dateSource = dateSourceRaw ? new Date(dateSourceRaw) : null;
  return {
    tripNum: t.tripNum || "-",
    routeName: t.routeName || "-",
    vendorName: t.vendorName || "-",
    driver: t.driver || "-",
    vehiclePlate: t.vehiclePlate || "-",
    vehicleType: t.vehicleType || "-",
    qtyParcelVal: t.qtyParcelVal || 0,
    stdOrigin: t.stdOrigin || null,
    staDest: t.staDest || null,
    atdOrigin: t.atdOrigin || null,
    ataDest: t.ataDest || null,
    etaDest: etaDateObj ? etaDateObj.toISOString() : null,
    tanggal: dateSource && !isNaN(dateSource) ? formatDateYYYYMMDDLocal(dateSource) : null,
    status: statusText
  };
}

// ===== Deteksi "Convoy" (fitur baru) =====
// Definisi convoy: 2 (atau lebih) unit yang ATA Destination-nya berjarak
// DI BAWAH 40 menit satu sama lain, di tanggal yang sama. Cara hitungnya:
// per tanggal, urutin trip yang UDAH punya ataDest dari yang paling pagi,
// lalu "rantai"-in trip yang jaraknya ke trip sebelumnya < 40 menit jadi
// satu grup. Grup yang cuma isi 1 trip (gak ada temen deketnya) dibuang —
// itu bukan convoy. Dihitung SEKALI di sini (JS), bukan diserahin ke AI,
// biar hasilnya konsisten & gak meleset kayak kalau AI disuruh
// ngira-ngira selisih waktu sendiri dari puluhan trip.
function computeConvoyGroups(trips){
  const byDate = {};
  trips.forEach(function (t){
    if (!t.ataDest || !t.tanggal) return; // convoy cuma valid buat trip yang UDAH sampai
    const ataMs = new Date(t.ataDest).getTime();
    if (isNaN(ataMs)) return;
    (byDate[t.tanggal] = byDate[t.tanggal] || []).push(Object.assign({}, t, { ataMs: ataMs }));
  });

  const CONVOY_WINDOW_MS = 40 * 60 * 1000; // di bawah 40 menit
  const groups = [];
  Object.keys(byDate).forEach(function (tanggal){
    const arr = byDate[tanggal].sort(function (a, b){ return a.ataMs - b.ataMs; });
    let current = [];
    arr.forEach(function (t){
      if (current.length && (t.ataMs - current[current.length - 1].ataMs) >= CONVOY_WINDOW_MS){
        if (current.length >= 2) groups.push(current);
        current = [];
      }
      current.push(t);
    });
    if (current.length >= 2) groups.push(current);
  });

  return groups.map(function (g, idx){
    return {
      convoyKe: idx + 1,
      tanggal: g[0].tanggal,
      jumlahUnit: g.length,
      rentangWaktuMenit: Math.round((g[g.length - 1].ataMs - g[0].ataMs) / 60000),
      units: g.map(function (t){
        return {
          tripNum: t.tripNum, vendorName: t.vendorName, driver: t.driver,
          qtyParcelVal: t.qtyParcelVal, staDest: t.staDest, ataDest: t.ataDest
        };
      })
    };
  });
}

// ===== AI "Daily Briefing" (fitur baru) =====
// Begitu Odyssey kebuka & data live udah kevalidasi login, langsung nembak
// 1 pesan ringkasan operasional ("30 detik briefing") tanpa nunggu user
// nanya duluan: jumlah Late Arrival & In Transit HARI INI, jumlah unit
// Convoy yang kedeteksi, anomali vendor (late rate hari ini naik jauh
// dibanding rata-rata 7 hari sebelumnya), dan daftar prioritas nomor trip
// yang paling perlu dicek. Semua dihitung di JS (bukan diserahin ke AI)
// biar angkanya konsisten & gak ngarang, sama kayak computeConvoyGroups().
function greetingSalutation(now){
  const h = now.getHours();
  if (h >= 4 && h < 11) return "Selamat pagi";
  if (h >= 11 && h < 15) return "Selamat siang";
  if (h >= 15 && h < 18) return "Selamat sore";
  return "Selamat malam";
}

// Bandingin late rate per vendor HARI INI vs rata-rata 7 hari sebelumnya.
// Butuh minimal 2 trip hari ini & minimal 3 trip di periode baseline biar
// gak ngasih alert dari sampel kekecilan (1 trip telat = "naik 100%" tapi
// gak berarti apa-apa). Ambang alert: naik >=15 poin persen.
function detectVendorLateRateAnomaly(todayTrips, baselineTrips){
  function rateByVendor(list){
    const map = {};
    list.forEach(function (t){
      const v = t.vendorName || "-";
      if (!map[v]) map[v] = { total: 0, late: 0 };
      map[v].total++;
      if (t.status === "Late Arrival") map[v].late++;
    });
    return map;
  }
  const todayMap = rateByVendor(todayTrips);
  const baseMap = rateByVendor(baselineTrips);
  let best = null;
  Object.keys(todayMap).forEach(function (v){
    const t = todayMap[v];
    const b = baseMap[v];
    if (t.total < 2 || !b || b.total < 3) return;
    const todayPct = Math.round((t.late / t.total) * 100);
    const basePct = Math.round((b.late / b.total) * 100);
    const jump = todayPct - basePct;
    if (jump >= 15 && (!best || jump > best.jump)){
      best = { vendorName: v, todayPct: todayPct, basePct: basePct, jump: jump };
    }
  });
  return best;
}

// Urutin trip Late Arrival buat daftar "Priority": trip yang MASIH di jalan
// & udah lewat ETA didahuluin (masih bisa dikejar/ditindaklanjuti sekarang),
// baru trip yang UDAH sampe tapi telat (cuma tinggal dicatat, gak ada yang
// bisa dilakuin lagi). Di dalam grup yang sama, makin lama telatnya makin
// diprioritasin duluan.
function rankPriorityTrips(lateTrips, now){
  return lateTrips.slice().sort(function (a, b){
    const aStillOnRoad = a.ataDest ? 0 : 1;
    const bStillOnRoad = b.ataDest ? 0 : 1;
    if (aStillOnRoad !== bStillOnRoad) return bStillOnRoad - aStillOnRoad;
    const aRef = a.ataDest ? new Date(a.ataDest) : now;
    const bRef = b.ataDest ? new Date(b.ataDest) : now;
    const aLateMs = a.etaDest ? (aRef - new Date(a.etaDest)) : 0;
    const bLateMs = b.etaDest ? (bRef - new Date(b.etaDest)) : 0;
    return bLateMs - aLateMs;
  }).map(function (t){ return t.tripNum; });
}

function buildDailyBriefingText(trips){
  const now = new Date();
  const salam = greetingSalutation(now);
  const todayStr = formatDateYYYYMMDDLocal(now);
  const todayTrips = trips.filter(function (t){ return t.tanggal === todayStr; });

  if (!todayTrips.length){
    return salam + " bro. Nih briefing 30 detik lo:\n\nBelum ada trip yang tercatat hari ini (" + todayStr +
      ") di data live. Begitu ada trip masuk, gua langsung update ke lo.";
  }

  const lateToday = todayTrips.filter(function (t){ return t.status === "Late Arrival"; });
  const transitToday = todayTrips.filter(function (t){ return t.status === "In Transit"; });
  const convoyToday = computeConvoyGroups(trips).filter(function (g){ return g.tanggal === todayStr; });
  const convoyUnitCount = convoyToday.reduce(function (sum, g){ return sum + g.jumlahUnit; }, 0);

  const sevenDaysAgoStart = new Date(todayStr + "T00:00:00");
  sevenDaysAgoStart.setDate(sevenDaysAgoStart.getDate() - 7);
  const baselineTrips = trips.filter(function (t){
    if (!t.tanggal || t.tanggal === todayStr) return false;
    const d = new Date(t.tanggal + "T00:00:00");
    return !isNaN(d) && d >= sevenDaysAgoStart;
  });
  const vendorAnomaly = detectVendorLateRateAnomaly(todayTrips, baselineTrips);
  const priorityTrips = rankPriorityTrips(lateToday, now).slice(0, 3);

  const lines = [];
  lines.push(salam + " bro. Nih briefing 30 detik lo:");
  lines.push("");
  lines.push("🔴 " + lateToday.length + " Late Arrival");
  lines.push("🟡 " + transitToday.length + " In Transit");
  lines.push("🚚 " + convoyUnitCount + " unit Convoy terdeteksi" + (convoyToday.length ? " (" + convoyToday.length + " grup)" : ""));
  if (vendorAnomaly){
    lines.push("⚠️ Vendor " + vendorAnomaly.vendorName + " late rate naik dari " + vendorAnomaly.basePct + "% ke " + vendorAnomaly.todayPct + "% (7 hari terakhir)");
  }
  if (priorityTrips.length){
    lines.push("");
    lines.push("**Priority:** cek " + priorityTrips.join(", ") + ".");
  }
  return lines.join("\n");
}

function fmtTime(iso){
  const d = new Date(iso);
  if (isNaN(d)) return "-";
  return d.toTimeString().slice(0,5);

function badgeClassFor(status){
  if (status === "Late Arrival") return "badge-late";
  if (status === "Early Arrived") return "badge-early";
  if (status === "In Transit") return "badge-transit";
  return "badge-ontime";
}

function renderAttachCard(units){
  if (!units || units.length === 0) return "";
  let rows = units.map(u => {
    return `<tr>
      <td>${u.tripNum||"-"}</td>
      <td>${u.vehiclePlate||"-"}</td>
      <td>${u.vendorName||"-"}</td>
      <td>${u.atdOrigin?fmtTime(u.atdOrigin):"-"}</td>
      <td>${u.ataDest?fmtTime(u.ataDest):"-"}</td>
      <td><span class="badge ${badgeClassFor(u.status)}">${u.status||"-"}</span></td>
    </tr>`;
  }).join("");
  return `<div class="attach-card"><table>
    <thead><tr><th>Trip</th><th>No Truk</th><th>Vendor</th><th>Berangkat</th><th>Tiba</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
