[build]
  command = "npm install --prefix netlify/functions"
  functions = "netlify/functions"
  publish = "."

# Alert Early Loading (per route)
[functions."check-occupancy-alerts"]
  schedule = "*/70 * * * *"
  included_files = [
    "netlify/functions/node_modules/@resvg/resvg-wasm/index_bg.wasm",
    "netlify/functions/node_modules/dejavu-fonts-ttf/ttf/*.ttf"
  ]

# Alert Parcel Stuck (per hub). Interval 70 menit dijaga di kode.
[functions."check-stuck-aging"]
  schedule = "*/5 * * * *"
