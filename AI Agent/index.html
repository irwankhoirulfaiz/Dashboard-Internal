<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Internal Palangka Raya DC</title>
<link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0b1329;
    color: #f1f5f9;
  }

  .shell { display: flex; flex-direction: column; height: 100vh; }

  .topnav {
    flex-shrink: 0;
    height: 38px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; /* Firefox */
  }
  .topnav::-webkit-scrollbar { display: none; } /* Chrome/Safari/Edge */
  .topnav .brand {
    font-weight: 700;
    font-size: 10.5px;
    color: #94a3b8;
    letter-spacing: 0.3px;
    padding: 0 10px 0 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: #475569;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 10.5px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab-btn:hover { background: #f1f5f9; color: #1e293b; }
  .tab-btn.active { background: #e67e22; color: #fff; }
  /* Tombol tab "AI Agent Odyssey" SENGAJA disembunyiin permanen dari topnav —
     Odyssey cuma diakses lewat FAB mengambang (lihat .odyssey-fab-wrap),
     bukan sebagai tab penuh. Elemennya dibiarin tetep ada di DOM (bukan
     dihapus) biar kode JS yang masih nyari elemen ini (ODYSSEY_TAB.btn) gak
     error, cuma gak pernah ditampilin ke user. */
  #tabBtnOdyssey { display: none !important; }
  .topnav-spacer { flex: 1; flex-shrink: 999; min-width: 4px; }
  .logout-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 6px; border: 1px solid #e2e8f0;
    background: transparent; color: #64748b; font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 10.5px; cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logout-btn:hover { border-color: #f87171; color: #f87171; }

  .frames { position: relative; flex: 1; min-height: 0; }
  .frames iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none; display: none;
  }
  .frames iframe.active { display: block; }

  /* ===== Floating Button "Odyssey" — bisa di-drag, muncul di ATAS SEMUA tab ===== */
  /* Wrapper yang digeser/di-drag (bukan tombolnya doang lagi), isinya tombol
     bulat (logo) + label kecil "The Odyssey" di bawahnya. */
  .odyssey-fab-wrap {
    position: fixed; right: 20px; bottom: 20px; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: grab; touch-action: none; user-select: none; transition: transform .15s;
  }
  .odyssey-fab-wrap:hover { transform: scale(1.06); }
  .odyssey-fab-wrap.dragging { cursor: grabbing; transition: none; }
  .odyssey-fab-wrap.odyssey-hidden { display: none; }
  .odyssey-fab {
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #e67e22, #ee2f6f); color: #fff;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); overflow: hidden; padding: 0; position: relative;
  }
  .odyssey-fab-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .odyssey-fab-close {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 22px; background: linear-gradient(135deg, #e67e22, #ee2f6f); color: #fff;
  }
  .odyssey-fab.is-open .odyssey-fab-img { display: none; }
  .odyssey-fab.is-open .odyssey-fab-close { display: flex; }
  .odyssey-fab-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .3px; color: #f1f5f9;
    background: rgba(15,23,42,.8); padding: 2px 9px; border-radius: 8px;
    white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }

  /* ===== Panel Popup Chat — muncul begitu FAB diklik (bukan di-drag) ===== */
  .odyssey-popup {
    position: fixed; right: 20px; bottom: 88px; z-index: 9998;
    width: 380px; height: 600px;
    min-width: 300px; min-height: 340px;
    max-width: calc(100vw - 24px); max-height: calc(100vh - 112px);
    background: #0b1329; border: 1px solid #1e293b; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); overflow: hidden;
    display: none; flex-direction: column;
  }
  .odyssey-popup.show { display: flex; }
  /* Handle resize custom — WAJIB elemen terpisah di atas iframe (bukan pakai
     CSS resize:both bawaan), karena iframe di dalam .odyssey-popup-body
     nutupin seluruh area kotak termasuk pojoknya, jadi grip resize bawaan
     browser gak pernah kena klik (ketutup iframe duluan). */
  .odyssey-resize-handle {
    position: absolute; right: 0; bottom: 0; width: 20px; height: 20px;
    z-index: 20; cursor: nwse-resize; touch-action: none;
    background:
      linear-gradient(135deg, transparent 0 50%, rgba(148,163,184,.6) 50% 58%, transparent 58% 100%),
      linear-gradient(135deg, transparent 0 70%, rgba(148,163,184,.6) 70% 78%, transparent 78% 100%);
    border-bottom-right-radius: 14px;
  }
  .odyssey-popup-head {
    flex-shrink: 0; height: 40px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px 0 12px; background: #131c33; border-bottom: 1px solid #1e293b;
    color: #f1f5f9; font-weight: 700; font-size: 12.5px;
  }
  /* "The" tetep pakai warna default header (putih pucat) — kalau dipaksa
     item/hitam beneran malah ketelen sama background gelap #131c33 ini,
     jadi gak kebaca. "Odyssey" dikasih warna oranye aksen (samain kayak
     tab aktif di topnav) biar dua kata itu kebeda jelas. */
  .odyssey-popup-title .odyssey-accent { color: #e67e22; }
  .odyssey-popup-head-actions { display: flex; align-items: center; gap: 6px; }
  .odyssey-popup-head-actions button {
    background: transparent; border: none; color: #94a3b8; font-size: 14px; cursor: pointer;
    width: 26px; height: 26px; border-radius: 6px;
  }
  .odyssey-popup-head-actions button:hover { background: rgba(255,255,255,.08); color: #f1f5f9; }
  /* Tombol "Refresh Data" — sebelumnya nempel di dalam iframe (topbar-nya
     sendiri, di atas chat-log), sekarang dipindah naik ke title bar popup ini
     biar sebaris sama "The Odyssey", jadi area di dalam iframe di bawahnya
     bisa full buat percakapan doang. Klik-nya nge-postMessage ke dalam
     iframe (lihat script bawah) buat manggil ulang loadData() di sana. */
  .odyssey-refresh-btn {
    width: auto !important; height: auto !important;
    padding: 5px 10px; border: 1px solid #1e293b !important; border-radius: 6px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10.5px !important;
    white-space: nowrap;
  }
  .odyssey-refresh-btn:hover { border-color: #475569 !important; }
  /* Iframe Odyssey TINGGAL DI SINI PERMANEN (satu-satunya wadahnya, dari awal
     load sampai seterusnya) — TIDAK PERNAH dipindah/appendChild ke wadah lain.
     Mindahin sebuah iframe yang udah ada isinya ke parent lain lewat DOM
     (appendChild) bikin browser nge-reload iframe itu dari nol (browsing
     context-nya di-reset), which is kenapa chat history-nya ilang tiap popup
     ditutup-buka lagi. Solusinya: iframe diem di tempat, yang gonta-ganti
     cuma TAMPILAN wadahnya lewat class ".tab-mode" (lihat di bawah) — jadi
     dari sudut pandang iframe, dia gak pernah "pindah" sama sekali. */
  .odyssey-popup-body { flex: 1; min-height: 0; position: relative; }
  .odyssey-popup-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block; }
  /* Pas lagi nge-drag handle resize, iframe DIMATIIN sementara pointer-nya —
     kalau enggak, begitu kursor mouse lewat di atas iframe pas drag, event
     mousemove-nya kesedot masuk ke document iframe (browsing context beda),
     bukan ke window luar yang lagi ngitung resize-nya, jadi macet di tengah
     jalan begitu kursor nyentuh area iframe. */
  .odyssey-popup.resizing .odyssey-popup-body iframe { pointer-events: none; }

  /* ===== Mode "tab penuh" (cuma kepake sekarang kalau tombol ⛶ "buka
     tampilan penuh" di popup diklik — tab "AI Agent Odyssey" sendiri udah
     disembunyiin dari topnav) =====
     Wadah yang SAMA PERSIS dipakai di mode popup, cuma di-restyle jadi
     ngisi seluruh area konten (persis posisi ".frames"). Title bar (judul +
     tombol Refresh Data/⛶/✕) TETEP keliatan di mode ini — cuma resize handle
     doang yang disembunyiin (gak relevan lagi wong ukurannya udah full).
     width/height dikasih !important buat nimpa inline style w/h peninggalan
     drag-resize popup (kalau user sempet resize popup-nya sebelum pindah ke
     tab penuh). */
  .odyssey-popup.tab-mode {
    top: 38px; right: 0; bottom: 0; left: 0;
    width: auto !important; height: auto !important;
    min-width: 0; min-height: 0; max-width: none; max-height: none;
    border: none; border-radius: 0; box-shadow: none;
  }
  .odyssey-popup.tab-mode .odyssey-resize-handle { display: none; }
</style>
</head>
<body>

<div class="shell">
  <div class="topnav">
    <span class="brand">🏢 Internal PKY DC</span>
    <button class="tab-btn active" id="tabBtnRestTime" onclick="showTab('rest-time')">⏳ Rest Time Monitoring</button>
    <button class="tab-btn" id="tabBtnPerformanceBagger" onclick="showTab('performance-bagger')">🏆 Performance Bagger</button>
    <button class="tab-btn" id="tabBtnInbound" onclick="showTab('inbound')">🚚 Inbound</button>
    <button class="tab-btn" id="tabBtnOdyssey" onclick="showTab('odyssey')">🤖 AI Agent Odyssey</button>
    <button class="tab-btn" id="tabBtnOutbound" onclick="showTab('outbound')">📦 Outbound Monitoring</button>
    <button class="tab-btn" id="tabBtnInventoryControl" onclick="showTab('inventory-control')">🗃️ Inventory Control</button>
    <div class="topnav-spacer"></div>
    <button class="logout-btn" onclick="logoutApp()">↩ Keluar</button>
  </div>
  <div class="frames" id="frames">
    <iframe id="iframeRestTime" data-src="rest-time.html" title="Rest Time Monitoring"></iframe>
    <iframe id="iframePerformanceBagger" data-src="performance-bagger.html" title="Performance Bagger"></iframe>
    <iframe id="iframeInbound" data-src="inbound.html" title="Inbound"></iframe>
    <iframe id="iframeOutbound" data-src="outbound.html" title="Outbound Monitoring"></iframe>
    <iframe id="iframeInventoryControl" data-src="inventory-control.html" title="Inventory Control"></iframe>
  </div>
</div>

<script src="auth-guard.js"></script>
<script>
  // ==== APP-SHELL TAB SWITCHER ====
  // Kedua iframe di-load sekali aja pas halaman ini kebuka (barengan sama auth check di
  // atas). Pindah tab abis itu cuma toggle display, jadi 0% reload & data yang lagi
  // ke-sync real-time di background (mis. import operator) gak ilang pas pindah tab.

  // Catatan: "odyssey" SENGAJA gak dimasukin ke TABS biasa ini. Iframe-nya
  // sekarang hidup permanen di dalam #odysseyPopupBody (lihat markup), bukan
  // di dalam #frames kayak tab-tab lain, jadi dia butuh perlakuan render yang
  // beda (lihat setOdysseyMode di bawah) — tapi tombolnya (tabBtnOdyssey) dan
  // src lazy-load-nya tetep dicek bareng tab lain di listener authReady.
  var TABS = {
    "rest-time": { iframe: "iframeRestTime", btn: "tabBtnRestTime" },
    "performance-bagger": { iframe: "iframePerformanceBagger", btn: "tabBtnPerformanceBagger" },
    "inbound": { iframe: "iframeInbound", btn: "tabBtnInbound" },
    "outbound": { iframe: "iframeOutbound", btn: "tabBtnOutbound" },
    "inventory-control": { iframe: "iframeInventoryControl", btn: "tabBtnInventoryControl" }
  };
  var ODYSSEY_TAB = { iframe: "iframeOdyssey", btn: "tabBtnOdyssey" };

  // ==== PEMBATASAN AKSES (dipicu auth-guard.js abis login kevalidasi) ====
  // Tab yang gak diizinkan buat email ybs: tombolnya disembunyiin DAN iframe-nya
  // GAK PERNAH dikasih src sama sekali (jadi gak pernah load/fetch data apapun),
  // bukan cuma disembunyiin doang lewat CSS.
  window.addEventListener("authReady", function (e) {
    var allowedTabs = (e.detail && e.detail.allowedTabs) || Object.keys(TABS);

    Object.keys(TABS).forEach(function (key) {
      var cfg = TABS[key];
      var btn = document.getElementById(cfg.btn);
      var iframe = document.getElementById(cfg.iframe);
      var allowed = allowedTabs.indexOf(key) !== -1;

      btn.style.display = allowed ? "" : "none";
      if (allowed && !iframe.src) iframe.src = iframe.dataset.src;
    });

    // FAB Odyssey (+ tombol tab-nya + lazy-load src-nya) cuma boleh nongol
    // kalau emailnya emang diizinin akses tab "odyssey" (ACCESS_MAP di
    // auth-guard.js) — SAMA PERSIS aturan tab lain, cuma diurus terpisah
    // karena iframe-nya gak tinggal di dalam TABS/#frames.
    odysseyAllowed = allowedTabs.indexOf("odyssey") !== -1;
    var odysseyBtn = document.getElementById(ODYSSEY_TAB.btn);
    var odysseyIframe = document.getElementById(ODYSSEY_TAB.iframe);
    odysseyBtn.style.display = odysseyAllowed ? "" : "none";
    if (odysseyAllowed && !odysseyIframe.src) odysseyIframe.src = odysseyIframe.dataset.src;

    // Default tab: yang pertama diizinkan (biasanya "rest-time" kalau full akses,
    // tapi buat email terbatas ini otomatis loncat ke tab yang emang boleh dia liat).
    var defaultTab = allowedTabs[0];
    if (defaultTab) showTab(defaultTab);
  });

  // Tab yang punya lebih dari 1 submenu di dalam file yang sama (outbound.html:
  // aging/occupancy, inventory-control.html: usage/stock) butuh nunggu iframe-nya
  // selesai load dulu sebelum bisa dikirimin perintah "setSubmenu".
  var tabReady = {};
  var pendingSubmenu = {};
  ["outbound", "inventory-control"].forEach(function (tab) {
    tabReady[tab] = false;
    document.getElementById(TABS[tab].iframe).addEventListener("load", function () {
      tabReady[tab] = true;
      if (pendingSubmenu[tab]) {
        sendSubmenu(tab, pendingSubmenu[tab]);
        pendingSubmenu[tab] = null;
      }
    });
  });

  function sendSubmenu(tab, submenu) {
    document.getElementById(TABS[tab].iframe).contentWindow.postMessage(
      { source: "pkydc", type: "setSubmenu", submenu: submenu }, "*"
    );
  }

  function showTab(tab, submenu) {
    if (tab !== "odyssey" && !TABS[tab]) return;
    if (tab === "odyssey" && !odysseyAllowed) return;

    // Tab-tab "biasa" (yang iframe-nya emang tinggal di dalam #frames):
    // matiin .active semua, nyalain punya yang dipilih. Odyssey DIKELUARIN
    // dari loop ini karena iframe-nya gak ada di dalam #frames lagi.
    Object.keys(TABS).forEach(function (key) {
      var isActive = key === tab;
      document.getElementById(TABS[key].iframe).classList.toggle("active", isActive);
      document.getElementById(TABS[key].btn).classList.toggle("active", isActive);
    });
    document.getElementById(ODYSSEY_TAB.btn).classList.toggle("active", tab === "odyssey");

    // Container Odyssey (popup) di-set ke mode "tab penuh" kalau tab yang
    // dituju emang "odyssey", atau disembunyiin total kalau enggak — TANPA
    // pernah mindah node iframe-nya (lihat setOdysseyMode).
    setOdysseyMode(tab === "odyssey" ? "tab" : "hidden");

    updateOdysseyFabVisibility(tab);

    if (submenu && tabReady.hasOwnProperty(tab)) {
      if (tabReady[tab]) sendSubmenu(tab, submenu);
      else pendingSubmenu[tab] = submenu; // iframe masih loading, kirim pas udah siap
    }

    // Tiap kali tab ini jadi aktif (termasuk balik lagi ke tab yang sama), suruh
    // halamannya nutup semua grup Sidebar Navigasi (Hide) biar user buka manual lagi —
    // gak keinget dari sesi sebelumnya, biar rapi tiap pindah tab.
    var targetIframe = document.getElementById(tab === "odyssey" ? ODYSSEY_TAB.iframe : TABS[tab].iframe);
    if (targetIframe && targetIframe.src) {
      targetIframe.contentWindow.postMessage({ source: "pkydc", type: "collapseSidebarGroups" }, "*");
    }
  }

  // Dengerin permintaan pindah tab dari dalam iframe (klik link sidebar rest-time.html
  // atau outbound.html yang udah di-hijack oleh bridge script di masing-masing halaman)
  window.addEventListener("message", function (e) {
    var data = e.data;
    if (!data || data.source !== "pkydc") return;
    if (data.type === "switchTab") {
      showTab(data.tab, data.submenu);
    }
  });

  // ===== Floating Odyssey Widget =====
  // Prinsip inti (BARU): iframe Odyssey (#iframeOdyssey) TINGGAL DIEM di
  // dalam #odysseyPopupBody dari awal sampai akhir — TIDAK PERNAH di-
  // appendChild ke wadah lain. Yang berubah cuma TAMPILAN wadah luarnya
  // (#odysseyPopup) lewat 3 mode:
  //   - "hidden" → wadah disembunyiin total (display:none)
  //   - "popup"  → wadah jadi kotak chat mengambang di pojok (style lama)
  //   - "tab"    → wadah di-restyle ngisi seluruh area tab (class .tab-mode)
  // Karena node iframe-nya gak pernah pindah/di-reparent, browsing context di
  // dalamnya (chatHistory di memori, listener Firebase, dll di report-agent.html)
  // gak pernah di-reset oleh browser — makanya history chat kejaga terus walau
  // popup dibuka-tutup atau di-switch ke tampilan tab penuh berkali-kali.
  var odysseyAllowed = false; // di-set true di authReady kalau tab "odyssey" diizinin
  var odysseyMode = "hidden"; // "hidden" | "popup" | "tab"

  function updateOdysseyFabVisibility(activeTab) {
    var fabWrap = document.getElementById("odysseyFabWrap");
    if (!fabWrap) return;
    // FAB disembunyiin kalau: (a) emailnya emang gak diizinin akses Odyssey
    // sama sekali, ATAU (b) user LAGI di tab Odyssey penuh (redundan, chat-nya
    // udah keliatan gede di layar, gak perlu tombol mengambang lagi).
    var shouldShow = odysseyAllowed && activeTab !== "odyssey";
    fabWrap.classList.toggle("odyssey-hidden", !shouldShow);
  }

  function setOdysseyMode(mode) {
    if (mode === odysseyMode) return;
    odysseyMode = mode;
    var popup = document.getElementById("odysseyPopup");
    var fab = document.getElementById("odysseyFab");
    popup.classList.toggle("show", mode !== "hidden");
    popup.classList.toggle("tab-mode", mode === "tab");
    fab.classList.toggle("is-open", mode === "popup");
  }

  function openOdysseyPopup() {
    if (!odysseyAllowed || odysseyMode === "popup") return;
    setOdysseyMode("popup");
  }
  function closeOdysseyPopup() {
    // Cuma nutup kalau lagi mode "popup" — kalau lagi mode "tab" (tampilan
    // penuh), penutupannya lewat pindah tab (showTab), bukan lewat tombol ✕
    // popup ini.
    if (odysseyMode !== "popup") return;
    setOdysseyMode("hidden");
  }
  function toggleOdysseyPopup() {
    if (odysseyMode === "popup") closeOdysseyPopup(); else openOdysseyPopup();
  }

  document.getElementById("odysseyPopupCloseBtn").addEventListener("click", closeOdysseyPopup);
  document.getElementById("odysseyExpandBtn").addEventListener("click", function () {
    // "Buka tampilan penuh": numpang logic showTab yang udah ada (otomatis
    // switch wadah Odyssey ke mode "tab" & pindahin tab aktif di topnav ke
    // "odyssey").
    showTab("odyssey");
  });
  document.getElementById("odysseyRefreshBtn").addEventListener("click", function () {
    // Tombol "Refresh Data" fisiknya sekarang di title bar popup ini (luar
    // iframe), padahal logic buat narik ulang data trip-nya (loadData())
    // masih hidup di dalam report-agent.html. Jadi klik di sini cuma
    // nge-postMessage ke dalam iframe — report-agent.html yang dengerin
    // pesan ini (lihat listener "pkydc"/"odysseyRefresh" di file itu) dan
    // yang beneran manggil loadData()-nya.
    var iframe = document.getElementById(ODYSSEY_TAB.iframe);
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage({ source: "pkydc", type: "odysseyRefresh" }, "*");
    }
  });

  // ===== FAB bisa di-drag (geser posisinya), tapi klik biasa (gak digeser)
  // tetep kebaca sebagai "buka/tutup popup". Posisi terakhir diinget lewat
  // localStorage biar gak balik ke pojok tiap refresh. =====
  (function setupOdysseyFabDrag() {
    var fab = document.getElementById("odysseyFabWrap");
    var POS_KEY = "odysseyFabPos_v1";
    var dragging = false, moved = false, startX = 0, startY = 0, origX = 0, origY = 0;

    function clampPos(x, y) {
      var margin = 8;
      var maxX = window.innerWidth - fab.offsetWidth - margin;
      var maxY = window.innerHeight - fab.offsetHeight - margin;
      return { x: Math.min(Math.max(x, margin), Math.max(margin, maxX)), y: Math.min(Math.max(y, margin), Math.max(margin, maxY)) };
    }
    function applyPos(x, y) {
      var p = clampPos(x, y);
      fab.style.left = p.x + "px";
      fab.style.top = p.y + "px";
      fab.style.right = "auto";
      fab.style.bottom = "auto";
      return p;
    }
    function savePos(p) {
      try { localStorage.setItem(POS_KEY, JSON.stringify(p)); } catch (e) { /* abaikan */ }
    }

    // Posisi awal: pulihin dari localStorage kalau ada (device/browser ini
    // pernah geser FAB-nya sebelumnya), kalau enggak biarin default CSS
    // (pojok kanan bawah).
    try {
      var saved = JSON.parse(localStorage.getItem(POS_KEY));
      if (saved && typeof saved.x === "number" && typeof saved.y === "number") applyPos(saved.x, saved.y);
    } catch (e) { /* abaikan, pakai default CSS */ }

    function pointerXY(e) {
      var p = (e.touches && e.touches[0]) || e;
      return { x: p.clientX, y: p.clientY };
    }
    function onDown(e) {
      dragging = true; moved = false;
      var rect = fab.getBoundingClientRect();
      var p = pointerXY(e);
      startX = p.x; startY = p.y; origX = rect.left; origY = rect.top;
      fab.classList.add("dragging");
    }
    function onMove(e) {
      if (!dragging) return;
      var p = pointerXY(e);
      var dx = p.x - startX, dy = p.y - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if (moved) {
        if (e.cancelable) e.preventDefault();
        applyPos(origX + dx, origY + dy);
      }
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      fab.classList.remove("dragging");
      if (moved) {
        var rect = fab.getBoundingClientRect();
        savePos(applyPos(rect.left, rect.top));
      } else {
        toggleOdysseyPopup(); // gak kegeser sama sekali = dianggap KLIK
      }
    }

    fab.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    fab.addEventListener("touchstart", onDown, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onUp);
    // Kalau jendela di-resize (rotate HP dll), pastiin FAB gak nyangkut di
    // luar viewport yang baru.
    window.addEventListener("resize", function () {
      var rect = fab.getBoundingClientRect();
      if (rect.left && rect.top) savePos(applyPos(rect.left, rect.top));
    });
  })();

  // ===== Resize manual panel popup Odyssey lewat handle custom di pojok =====
  // (BUKAN pakai CSS resize:both bawaan browser — itu gagal kepencet karena
  // iframe di dalam popup-body nutupin seluruh kotak sampai ke pojoknya.
  // Handle ini elemen terpisah dengan z-index lebih tinggi dari iframe, jadi
  // klik-tariknya selalu kena duluan sebelum nyentuh iframe di bawahnya.)
  // Popup posisinya fixed pakai right/bottom (bukan left/top), jadi pas
  // dibesarin, kotaknya nambah ke arah kiri-atas — anchor kanan-bawahnya
  // (deket FAB) tetap diem di tempat.
  (function setupOdysseyPopupResize() {
    var popup = document.getElementById("odysseyPopup");
    var handle = document.getElementById("odysseyResizeHandle");
    if (!popup || !handle) return;
    var resizing = false, startX = 0, startY = 0, startW = 0, startH = 0;

    function pointerXY(e) {
      var p = (e.touches && e.touches[0]) || e;
      return { x: p.clientX, y: p.clientY };
    }
    function onDown(e) {
      resizing = true;
      popup.classList.add("resizing");
      var rect = popup.getBoundingClientRect();
      var p = pointerXY(e);
      startX = p.x; startY = p.y; startW = rect.width; startH = rect.height;
      if (e.cancelable) e.preventDefault();
    }
    function onMove(e) {
      if (!resizing) return;
      if (e.cancelable) e.preventDefault();
      var p = pointerXY(e);
      var dx = p.x - startX, dy = p.y - startY;
      // min-width/min-height/max-width/max-height di CSS otomatis nge-clamp
      // hasilnya walau kita set inline style width/height langsung di sini.
      popup.style.width = (startW + dx) + "px";
      popup.style.height = (startH + dy) + "px";
    }
    function onUp() {
      resizing = false;
      popup.classList.remove("resizing");
    }

    handle.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    handle.addEventListener("touchstart", onDown, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onUp);
  })();
</script>

</body>
</html>
